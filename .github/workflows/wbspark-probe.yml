name: wbSpark 외부 접근성 프로브

# GitHub Actions 러너(=클라우드, 외부망)에서 사내 qwen-image 게이트웨이가
# 실제로 닿는지 확인용. job_id 를 받으면 CI 자동 파이프라인에 연결 가능하다는 뜻.
# (이미지 생성 완료까지 기다리지 않고 '제출 성공' 여부만 빠르게 확인)

on:
  workflow_dispatch:
  push:
    # 임시: 조사 브랜치 push 로도 실행(디스패치 권한 없는 환경에서 프로브용). main 머지 전 제거.
    branches:
      - "claude/github-actions-usage-thumbnails-dlvcj6"
    paths:
      - ".github/workflows/wbspark-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: DNS + 접근성 + job 제출 확인
        run: |
          set +e
          # 임시 진단: 04:34:30Z 제출한 프로브 잡이 결국 완료됐는지 확인(느림 vs 멈춤 판별)
          if [ -n "0bbe65da5e08" ]; then
            echo "=== 0) 이전 프로브 잡 0bbe65da5e08 상태(제출 04:34:30Z) ==="
            curl -s --max-time 15 "https://wangbyul.com/wbSpark/jobs/0bbe65da5e08"; echo ""
            echo "현재 시각: $(date -u +%H:%M:%S)Z"
            exit 0
          fi
          echo "=== 1) 외부에서 wangbyul.com DNS 해석 ==="
          getent hosts wangbyul.com || nslookup wangbyul.com || true
          echo ""
          echo "=== 2) 루트 접근 ==="
          curl -s -o /dev/null -w "root HTTP %{http_code} (time %{time_total}s)\n" --max-time 20 https://wangbyul.com
          echo ""
          echo "=== 3) POST /wbSpark/jobs (job 제출) ==="
          RESP=$(curl -s --max-time 40 -X POST https://wangbyul.com/wbSpark/jobs \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"type":"image","prompt":"CI connectivity probe"}')
          echo "응답 본문: $RESP"
          echo ""
          if echo "$RESP" | grep -q 'job_id'; then
            echo "✅ 외부(CI)에서 wbSpark 호출 성공 — 게이트웨이 이미 공개됨 → 자동 파이프라인 연결 가능"
          else
            echo "❌ CI에서 job_id 못 받음 — 외부 미개방/인증/경로 문제. 서버측 변경 필요."
            exit 0
          fi
          echo ""
          echo "=== 4) 잡 진행 확인(워커 생존 진단 — 최대 3분 폴링) ==="
          # 제출만 성공하고 running 에서 멈추는 장애(2026-07-17 관측)를 구분하기 위해
          # 상태 전이를 관찰한다: queued→running→done 이면 워커 정상.
          JOB_ID=$(echo "$RESP" | sed -n 's/.*"job_id" *: *"\([^"]*\)".*/\1/p')
          echo "job_id=$JOB_ID"
          for i in $(seq 1 36); do
            S=$(curl -s --max-time 15 "https://wangbyul.com/wbSpark/jobs/$JOB_ID")
            ST=$(echo "$S" | sed -n 's/.*"status" *: *"\([^"]*\)".*/\1/p')
            echo "[$(date -u +%H:%M:%S)] status=$ST"
            case "$ST" in
              done)  echo "✅ 워커 정상 — 생성 완료까지 확인"; exit 0 ;;
              error|failed) echo "❌ 워커가 잡을 실패 처리: $S"; exit 0 ;;
            esac
            sleep 5
          done
          echo "⚠️ 3분 내 완료 안 됨(마지막 status=$ST) — 워커 멈춤/큐 적체 의심. 서버에서 qwen-image 워커 확인 필요."
