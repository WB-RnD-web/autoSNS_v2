name: wbSpark 외부 접근성 프로브

# GitHub Actions 러너(=클라우드, 외부망)에서 사내 qwen-image 게이트웨이가
# 실제로 닿는지 확인용. job_id 를 받으면 CI 자동 파이프라인에 연결 가능하다는 뜻.
# (이미지 생성 완료까지 기다리지 않고 '제출 성공' 여부만 빠르게 확인)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: DNS + 접근성 + job 제출 확인
        run: |
          set +e
          echo "=== 1) 외부에서 wangbyul.com DNS 해석 ==="
          getent hosts wangbyul.com || nslookup wangbyul.com || true
          echo ""
          echo "=== 2) 루트 접근 ==="
          curl -s -o /dev/null -w "root HTTP %{http_code} (time %{time_total}s)\n" --max-time 20 https://wangbyul.com
          echo ""
          echo "=== 3) POST /wbSpark/jobs (job 제출) ==="
          RESP=$(curl -s --max-time 40 -X POST https://wangbyul.com/wbSpark/jobs \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{"type":"image","prompt":"CI connectivity probe"}')
          echo "응답 본문: $RESP"
          echo ""
          if echo "$RESP" | grep -q 'job_id'; then
            echo "✅ 외부(CI)에서 wbSpark 호출 성공 — 게이트웨이 이미 공개됨 → 자동 파이프라인 연결 가능"
          else
            echo "❌ CI에서 job_id 못 받음 — 외부 미개방/인증/경로 문제. 서버측 변경 필요."
          fi
