name: wbSpark 외부 접근성 프로브

# GitHub Actions 러너(=클라우드, 외부망)에서 사내 게이트웨이가 실제로 닿는지 +
# 워커가 실제로 생성을 완료하는지 확인용.
#
# ─────────────────────────────────────────────────────────────────────────────
#  ⚠️ 격리 원칙 — 이 파일의 값이 프로덕션 디자인/파이프라인에 새어나가면 안 된다
# ─────────────────────────────────────────────────────────────────────────────
#  · 이 워크플로는 POST /jobs 와 GET /jobs/{id} 만 부른다. 서버 설정을 바꾸지 않는다.
#  · 아래 하드코딩 값(model·prompt·size)은 전부 **이 프로브의 요청 안에서만** 산다.
#    서버의 기본값·라우팅 규칙·디자인 파라미터를 건드리지 않는다.
#  · 특히 model:"z-image" 는 프로브를 결정적으로 만들기 위한 것이지,
#    프로덕션이 그 모델을 쓰라는 뜻이 아니다. 여기 값을 실제 파이프라인에
#    복사하지 말 것 — 파이프라인은 파이프라인의 정책을 따른다.
#  · 산출물은 서버에 이미지 2장이 남을 뿐이고, 게이트웨이가 1시간 뒤 자동 정리한다.
#
# ─────────────────────────────────────────────────────────────────────────────
#  A/B 진단
# ─────────────────────────────────────────────────────────────────────────────
#   A) no_llm:true  → ComfyUI 만 검사 (LLM 우회)
#   B) 기본         → route_prompt(LLM) + ComfyUI 전체 경로 검사
#   A만 성공하면 LLM(route_prompt) 쪽, 둘 다 실패면 ComfyUI/GPU 쪽.
#
# ─────────────────────────────────────────────────────────────────────────────
#  2026-09-07 개정 — 이전 판의 틀린 전제 4가지를 고침
# ─────────────────────────────────────────────────────────────────────────────
#  1. 이전 판은 "Qwen-Image 를 검사한다"고 적혀 있었으나 실제로는 Z-Image 로 갔다.
#     needs_text() 키워드(글자/간판/text/sign/title/word/logo…)에 두 프롬프트 모두
#     걸리지 않았기 때문. 기준시간 78초도 Qwen 값이라 안 맞았다.
#  2. 테스트 B 가 비결정적이었다. needs_text 는 원문뿐 아니라 **LLM 이 재작성한
#     enhanced_prompt 도** 검사한다. LLM 출력에 word/sign/title 이 섞이면 그 실행만
#     Qwen-Image(30GB)로 빠진다. → model 을 명시해 분기를 고정했다.
#  3. LLM 이 gpt-oss:120b 가 아니다. 2026-08-24 gemma4:26b(Q4) → 2026-09-07
#     gemma-4-26B-A4B-it (vLLM bf16, 상주형). "66GB 콜드 재로드"는 이제 없다.
#  4. "전역 직렬 큐(1워커)"가 아니다. 2026-08-08 부터 3레인(gpu 직렬 / cpu / llm 4워커).
#
#  기준시간은 이제 하드코딩하지 않는다. 서버가 응답에 담아주는 elapsed·model 을
#  그대로 보고한다 — 기준값이 낡아 거짓 판정을 내는 걸 막기 위해.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "게이트웨이 주소"
        required: false
        default: "https://wangbyul.com/wbSpark"
      probe_qwen:
        description: "Qwen-Image 경로도 검사 (30GB 로드 — 서버 여유가 없으면 위험)"
        type: boolean
        required: false
        default: false
      fail_on_error:
        description: "실패 시 워크플로를 빨갛게 표시"
        type: boolean
        required: false
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE: ${{ inputs.base_url || 'https://wangbyul.com/wbSpark' }}
      # 타임아웃은 넉넉히. 기준시간이 아니라 '이 이상이면 뭔가 잘못된 것' 선이다.
      TIMEOUT_A: "200"
      TIMEOUT_B: "260"
      TIMEOUT_Q: "300"
    steps:
      - name: DNS + 접근성 + A/B 생성 진단
        shell: bash
        run: |
          set +e
          FAIL_ON_ERROR="${{ inputs.fail_on_error }}"
          PROBE_QWEN="${{ inputs.probe_qwen }}"

          jget() { sed -n 's/.*"'"$1"'" *: *"\([^"]*\)".*/\1/p'; }
          jnum() { sed -n 's/.*"'"$1"'" *: *\([0-9.]*\).*/\1/p'; }

          submit() {  # $1=JSON body → stdout job_id (실패 시 빈값)
            R=$(curl -s --max-time 40 -X POST "$BASE/jobs" \
              -H "Content-Type: application/json; charset=utf-8" -d "$1")
            echo "  제출 응답: $R" >&2
            echo "$R" | jget job_id
          }

          poll() {  # $1=job_id $2=최대초 → 0=done 1=error 2=타임아웃
            T0=$(date +%s); LAST=""
            while [ $(( $(date +%s) - T0 )) -lt "$2" ]; do
              S=$(curl -s --max-time 15 "$BASE/jobs/$1")
              ST=$(echo "$S" | jget status)
              if [ "$ST" != "$LAST" ]; then
                echo "  [+$(( $(date +%s) - T0 ))s] status=$ST"; LAST="$ST"
              fi
              case "$ST" in
                done)
                  # 서버가 알려주는 사실을 그대로 보고한다 (기준값 하드코딩 금지)
                  EL=$(echo "$S" | jnum elapsed)
                  MD=$(echo "$S" | jget model)
                  WH="$(echo "$S" | jnum width)x$(echo "$S" | jnum height)"
                  echo "  ✅ 완료 — 서버측 ${EL}초 / 모델 ${MD:-?} / ${WH}"
                  ACTUAL_MODEL="$MD"
                  return 0 ;;
                error|failed)
                  echo "  ❌ 실패 (+$(( $(date +%s) - T0 ))s): $S"; return 1 ;;
              esac
              sleep 5
            done
            echo "  ⚠️ ${2}s 내 완료 안 됨 (마지막 status=${ST:-무응답})"; return 2
          }

          echo "=== 1) DNS + 접근성 ==="
          getent hosts "$(echo "$BASE" | sed -E 's#https?://([^/]+).*#\1#')" || true
          curl -s -o /dev/null -w "  루트     HTTP %{http_code}  (%{time_total}s)\n" \
            --max-time 20 "$(echo "$BASE" | sed -E 's#(https?://[^/]+).*#\1#')"
          H=$(curl -s --max-time 20 "$BASE/health")
          echo "  /health  $H"
          if [ -z "$H" ]; then
            echo "❌ 게이트웨이 무응답 — 이후 테스트 무의미. 중단."
            [ "$FAIL_ON_ERROR" = "true" ] && exit 1 || exit 0
          fi

          echo ""
          echo "=== 2) 사전 확인: 남의 작업 중인가 ==="
          Q=$(echo "$H" | jnum queued)
          echo "  대기열 ${Q:-?}건"
          if [ "${Q:-0}" -gt 0 ] 2>/dev/null; then
            echo "  ⚠️ 실작업이 돌고 있습니다. 프로브가 GPU 레인에서 그 뒤에 줄을 섭니다."
            echo "     (측정 시간이 길어질 뿐 결과는 유효합니다)"
          fi

          # ── 테스트 A ────────────────────────────────────────────────────────
          # no_llm:true 로 LLM 을 우회. model 을 명시해 needs_text 분기를 타지 않게 한다
          #   → 어느 모델이 돌지가 결정적이 되어, 실패 시 원인이 한 곳으로 좁혀진다.
          echo ""
          echo "=== 3) 테스트 A: no_llm — ComfyUI 단독 (모델 고정) ==="
          A_ID=$(submit '{"type":"image","prompt":"a red apple on a white table, studio lighting","no_llm":true,"model":"z-image"}')
          if [ -z "$A_ID" ]; then
            echo "❌ A 제출 실패 — 게이트웨이 접근/큐 문제"
            [ "$FAIL_ON_ERROR" = "true" ] && exit 1 || exit 0
          fi
          echo "  job_id=$A_ID"
          poll "$A_ID" "$TIMEOUT_A"; A_RC=$?; A_MODEL="$ACTUAL_MODEL"

          # ── 테스트 B ────────────────────────────────────────────────────────
          # LLM 보정을 켠 전체 경로. 여기서도 model 을 고정하는 이유:
          #   needs_text 가 LLM 이 만든 enhanced_prompt 까지 검사하므로, 고정하지 않으면
          #   실행마다 Z-Image(21GB) / Qwen-Image(30GB) 로 갈려 측정이 비교 불가능해지고
          #   서버 여유가 빠듯한 날엔 위험하다. 여기서 검사하려는 건 'LLM 이 살아 있는가'다.
          echo ""
          echo "=== 4) 테스트 B: LLM 보정 포함 — 전체 경로 (모델 고정) ==="
          B_ID=$(submit '{"type":"image","prompt":"CI 프로브: 노을 지는 바닷가","model":"z-image"}')
          if [ -z "$B_ID" ]; then
            echo "❌ B 제출 실패"
            [ "$FAIL_ON_ERROR" = "true" ] && exit 1 || exit 0
          fi
          echo "  job_id=$B_ID"
          poll "$B_ID" "$TIMEOUT_B"; B_RC=$?; B_MODEL="$ACTUAL_MODEL"

          # ── 테스트 C (선택) ─────────────────────────────────────────────────
          # Qwen-Image 는 30GB 를 요구한다. LLM 이 상주하는 날엔 여유가 빠듯할 수 있어
          # 기본 비활성. 한글 글자 렌더링 경로를 정말 검증해야 할 때만 켠다.
          C_RC=-1; C_MODEL=""
          if [ "$PROBE_QWEN" = "true" ]; then
            echo ""
            echo "=== 5) 테스트 C: Qwen-Image (글자 경로) ==="
            echo "  ⚠️ 30GB 로드. 서버 여유가 부족하면 느려지거나 실패할 수 있습니다."
            C_ID=$(submit '{"type":"image","prompt":"a wooden shop signboard that reads OPEN","no_llm":true,"model":"qwen"}')
            if [ -n "$C_ID" ]; then
              echo "  job_id=$C_ID"
              poll "$C_ID" "$TIMEOUT_Q"; C_RC=$?; C_MODEL="$ACTUAL_MODEL"
            else
              echo "❌ C 제출 실패"; C_RC=1
            fi
          fi

          # ── 판정 ────────────────────────────────────────────────────────────
          echo ""
          echo "=== 판정 ==="
          echo "  A(ComfyUI 단독) rc=$A_RC  실제모델=${A_MODEL:-?}"
          echo "  B(LLM 포함)     rc=$B_RC  실제모델=${B_MODEL:-?}"
          [ "$C_RC" -ge 0 ] && echo "  C(Qwen 글자)    rc=$C_RC  실제모델=${C_MODEL:-?}"

          # 모델 고정이 실제로 먹었는지 확인 — 서버 라우팅이 바뀌면 여기서 드러난다
          for pair in "A:$A_MODEL" "B:$B_MODEL"; do
            n="${pair%%:*}"; v="${pair#*:}"
            if [ -n "$v" ] && [ "${v#z-image}" = "$v" ]; then
              echo "  ⚠️ $n 이 z-image 가 아닌 '$v' 로 돌았습니다 — 서버 라우팅 규칙 변경 의심"
            fi
          done

          echo ""
          RC=0
          if [ $A_RC -eq 0 ] && [ $B_RC -eq 0 ]; then
            echo "✅ 둘 다 정상 완료 — 외부 접근·워커 모두 정상."
          elif [ $A_RC -eq 0 ]; then
            echo "🔎 A 만 성공 — LLM(route_prompt) 경로 문제."
            echo "     서버에서: docker ps --filter name=gemma4-vllm"
            echo "               curl -s 127.0.0.1:8000/v1/models"
            echo "               docker restart gemma4-vllm   # 재기동 약 9분 (가중치 48GB)"
            echo "     ※ ollama 재시작은 효과 없습니다 — LLM 백엔드는 vLLM 입니다(2026-09-07 전환)."
            RC=1
          else
            echo "🔎 A 부터 실패 — ComfyUI/GPU 쪽 문제."
            echo "     서버에서: curl -s 127.0.0.1:8188/queue"
            echo "               systemctl status comfyui"
            echo "               free -g          # 통합메모리 여유 확인"
            echo "               bash ~/stack.sh fix   # 멎은 ComfyUI 강제 복구"
            RC=1
          fi
          if [ "$C_RC" -gt 0 ]; then
            echo "⚠️ C(Qwen) 실패 — 글자 렌더링 경로만 문제. 통합메모리 여유 부족일 가능성이 높습니다."
            RC=1
          fi

          [ "$FAIL_ON_ERROR" = "true" ] && exit $RC || exit 0
