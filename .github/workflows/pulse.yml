name: 채널 맥박 — 분석 루틴 보고서 검사 → (제안이 있으면) 테스트 통과한 개선 PR

# 2026-10-05 사용자: "매일 채널 상태·추세·방향·트렌드를 분석해 보고서를 쓰고, 필요하면 PR 까지 — 지속적인 피드백과 개선".
# 흐름: 트렌드 레이더(매일 새벽) → 분석 루틴(Opus 5.5)이 tools/pulse.py build 로 숫자를 내고 fill.json(해석)을 써서
#   routine/pulse(★누적 브랜치)에 push → 이 워크플로가 ★다시 검사(pulse.py check)한다. fill.json 에 pr 이 있으면
#   숫자를 다시 내서 근거를 확인(verify-pr)하고, main 위에 pr.patch 를 얹어 ★모든 테스트를 돌린 뒤
#   pulse/<날짜>-<slug> 브랜치를 올리고 PR 을 연다. 머지는 사람이 한다.
# ★push 는 pulse/* 브랜치 하나로만(main·routine/* 아님) — 어느 워크플로도 pulse/** 를 보지 않으니 영상 업로드가 깨어나지 않는다.
#   (routine/pulse 는 shorts.yml 의 routine/** 에 걸리지만 그쪽은 output/news 경로만 본다)
# ★열린 pulse PR 이 있으면 새로 만들지 않는다 — 안 본 PR 이 쌓이지 않게.
# PR 열기: GITHUB_TOKEN(pull-requests: write) → 안 되면 GH_PAT → 둘 다 막히면 비교 링크만 남긴다(보고서 페이지에도 있다).

on:
  push:
    branches:
      - "routine/pulse"
    paths:
      - "output/pulse/**"
  workflow_dispatch:
    inputs:
      day:
        description: "다시 검사할 날짜(YYYY-MM-DD) — 수동 실행은 검사만 하고 PR 은 만들지 않는다"
        default: ""

permissions:
  contents: write          # pulse/<날짜>-<slug> 브랜치 하나만 push 한다(아래 push 줄)
  pull-requests: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
    steps:
      # ★코드는 항상 main 에서 — routine/pulse 는 누적 브랜치라 코드가 낡는다.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 테스트(맥박 오프라인)
        run: python tools/test_pulse.py

      - name: 보고서 가져오기(routine/pulse — 데이터만)
        id: pick
        run: |
          set -euo pipefail
          git fetch -q origin routine/pulse
          HEAD_SHA=$(git rev-parse FETCH_HEAD)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DAYS="${{ github.event.inputs.day }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
              BEFORE="$HEAD_SHA~1"
            fi
            DAYS=$(git diff --name-only "$BEFORE" "$HEAD_SHA" -- 'output/pulse/*/fill.json' | cut -d/ -f3 | sort -u | tr '\n' ' ' || true)
          fi
          if [ -z "${DAYS// }" ]; then
            DAYS=$(git ls-tree --name-only "$HEAD_SHA" output/pulse/ | cut -d/ -f3 | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -1 || true)
          fi
          mkdir -p "$RUNNER_TEMP/pulse"
          if git ls-tree -d --name-only "$HEAD_SHA" output/pulse/ | grep -q .; then
            git archive "$HEAD_SHA" output/pulse | tar -x -C "$RUNNER_TEMP/pulse"
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "대상: '$DAYS'"

      - name: 검사(숫자는 코드, 해석은 루틴 — fill.json 이 규칙을 지켰나)
        id: chk
        if: steps.pick.outputs.days != ''
        run: |
          set -euo pipefail
          PR=""
          for d in ${{ steps.pick.outputs.days }}; do
            python tools/pulse.py check "$RUNNER_TEMP/pulse/output/pulse/$d"
            if [ -s "$RUNNER_TEMP/pulse/output/pulse/$d/pr.patch" ]; then PR="$d"; fi
          done
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          LAST=$(echo ${{ steps.pick.outputs.days }} | awk '{print $NF}')
          head -60 "$RUNNER_TEMP/pulse/output/pulse/$LAST/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 개선 PR(근거 재확인 · 모든 테스트 통과할 때만)
        if: steps.chk.outputs.pr != '' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          D="${{ steps.chk.outputs.pr }}"
          DIR="$RUNNER_TEMP/pulse/output/pulse/$D"
          # 근거 재확인: 레이더 데이터로 숫자를 다시 내서, PR 근거 플래그가 정말 있고 3일 이상 이어졌는지 본다
          mkdir -p "$RUNNER_TEMP/radar"
          git fetch -q --depth=1 origin data/trend-radar
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/radar"
          mkdir -p "$RUNNER_TEMP/ypp"
          if git fetch -q --depth=1 origin data/ypp 2>/dev/null; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/ypp"; fi
          python tools/pulse.py verify-pr "$DIR" --radar "$RUNNER_TEMP/radar" --ypp "$RUNNER_TEMP/ypp"
          BR=$(python tools/pulse.py pr "$DIR" --field branch)
          TITLE=$(python tools/pulse.py pr "$DIR" --field title)
          python tools/pulse.py pr "$DIR" --field body > "$RUNNER_TEMP/body.md"
          OPEN=$(gh pr list --state open --limit 100 --json headRefName -q '.[].headRefName' | grep '^pulse/' || true)
          if [ -n "$OPEN" ]; then echo "::notice::열린 맥박 PR 이 있어 새로 만들지 않는다: $OPEN"; exit 0; fi
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null; then echo "::notice::$BR 브랜치가 이미 있다"; exit 0; fi
          git checkout -q -B "$BR" origin/main
          git apply --index "$DIR/pr.patch"
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk >/dev/null
          python -m pip install -q -r pipeline/requirements.txt numpy google-api-python-client google-auth
          bash tools/run_tests.sh
          git -c user.name="channel-pulse" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$TITLE" -m "채널 맥박 $D 의 제안 — output/pulse/$D/report.md (routine/pulse)"
          git push origin "HEAD:refs/heads/$BR"
          if gh pr create --base main --head "$BR" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; then exit 0; fi
          if [ -n "$PAT" ] && GH_TOKEN="$PAT" gh pr create --base main --head "$BR" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"; then exit 0; fi
          echo "::warning::PR 을 열 권한이 없다 — 브랜치만 올렸다. 열기: https://github.com/${{ github.repository }}/compare/main...$BR?expand=1"
          echo "PR 열기(권한 없음): https://github.com/${{ github.repository }}/compare/main...$BR?expand=1" >> "$GITHUB_STEP_SUMMARY"
