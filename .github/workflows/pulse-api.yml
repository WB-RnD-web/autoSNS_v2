name: 채널 맥박(API) — 루틴 대신 Claude API 로 해석 쓰기 · 지금은 나란히 비교(data/pulse-api)

# 2026-10-31 사용자: Max 계정마다 따로 붙는 월 200달러 API 크레딧을 쓰고, 구독 주간 한도(루틴·세션이 같이 쓴다)는 아끼자.
#   분석 루틴(Opus · 07:30)이 하던 '해석'을 tools/pulse_api.py 가 API 한 번(+검사 오류 때 다시)으로 쓴다.
#   숫자는 같은 tools/pulse.py build, 규칙은 같은 tools/PULSE.md, 검사도 같은 pulse.py check.
# ★지금은 비교 기간: 결과를 data/pulse-api 에만 쌓는다 — PR·routine/pulse 는 건드리지 않는다(루틴이 계속 쓴다).
#   며칠 견줘 보고 괜찮으면 다음 PR 에서 routine/pulse 쪽으로 넣고 루틴을 끈다.
# 언제: 트렌드 레이더 → 웹 정찰이 끝나면 바로(workflow_run — 예약 cron 은 이 레포에서 몇 시간씩 늦는다) · 10:10 KST 예비.
#   같은 날 두 번째부터는 건너뛴다(data/pulse-api 에 오늘 폴더가 있으면).
# 비용: <날짜>/api.json 에 실제 토큰·달러. 크레딧이 바닥나면 API 가 거절할 뿐 돈은 안 나간다(결제 수단 없음 · 월 한도 200달러).
# ⚠️ main·routine/* 에는 아무것도 올리지 않는다 — data/pulse-api 에 고아 커밋 하나로 강제(트렌드 레이더와 같은 방식).
# 시험: api-test/pulse 브랜치에 올리면 그 브랜치 코드로 한 번 돈다(머지 전 확인용 · 업로드 워크플로는 이 브랜치를 안 본다).

on:
  # ★10/31 웹 정찰(scout-api.yml — 레이더가 끝나면 돈다)이 끝나면 돈다: 레이더 → 정찰 → 맥박(정찰이 실패해도 맥박은 돈다).
  workflow_run:
    workflows: ["웹 정찰(API) — 지금 뜨는 주제·소재 후보 찾기(data/scout)"]
    types: [completed]
  schedule:
    - cron: "10 1 * * *"     # 10:10 KST 예비(레이더가 늦거나 실패한 날)
  workflow_dispatch:
  push:
    branches:
      - "api-test/pulse"

permissions:
  contents: write

concurrency:
  group: pulse-api
  cancel-in-progress: false

jobs:
  write:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      DATA_BRANCH: data/pulse-api
      PULSE_MODEL: ${{ vars.PULSE_MODEL || 'claude-opus-5-5' }}
      PULSE_EFFORT: ${{ vars.PULSE_EFFORT || 'high' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 50       # 최근 4일 커밋(바뀐 것이 오르내림을 설명할 수 있다)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: python -m pip install -q anthropic

      - name: 테스트(오프라인)
        run: |
          python tools/test_pulse_api.py
          python tools/test_pulse.py

      - name: 오늘·데이터 받기
        id: prep
        run: |
          set -euo pipefail
          DAY=$(date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          W="$RUNNER_TEMP/w"
          mkdir -p "$W/out/output/pulse" "$W/api" "$RUNNER_TEMP/radar" "$RUNNER_TEMP/ypp"
          if git fetch -q --no-tags --depth=1 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"; then
            git archive "origin/$DATA_BRANCH" | tar -x -C "$W/api"
          fi
          if [ -d "$W/api/$DAY" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::오늘($DAY)은 이미 썼다 — 건너뛴다"
            exit 0
          fi
          git fetch -q --no-tags --depth=1 origin data/trend-radar
          git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/radar"
          if git fetch -q --no-tags --depth=1 origin data/ypp; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/ypp"; fi
          mkdir -p "$RUNNER_TEMP/scout"
          if git fetch -q --no-tags --depth=1 origin data/scout; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/scout"; fi
          # 지난 날(추세·플래그 연속 일수·예측 채점): 루틴 보고서 위에 API 판 보고서를 덮는다 → API 판은 자기 예측으로 채점된다
          if git fetch -q --no-tags --depth=1 origin routine/pulse; then git archive FETCH_HEAD output/pulse | tar -x -C "$W/out" || true; fi
          for d in "$W"/api/20*; do if [ -d "$d" ]; then rm -rf "$W/out/output/pulse/$(basename "$d")"; cp -r "$d" "$W/out/output/pulse/"; fi; done
          rm -rf "$W/out/output/pulse/$DAY"
          ls "$W/out/output/pulse" | tail -5

      - name: 숫자(pulse.py build)
        if: steps.prep.outputs.skip != '1'
        run: python tools/pulse.py build --radar "$RUNNER_TEMP/radar" --out "$RUNNER_TEMP/w/out/output/pulse" --date "${{ steps.prep.outputs.day }}" --ypp "$RUNNER_TEMP/ypp"

      - name: 해석(Claude API)
        if: steps.prep.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCOUT_FILE: ${{ runner.temp }}/scout/${{ steps.prep.outputs.day }}.json
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::시크릿 ANTHROPIC_API_KEY 없음"; exit 1; fi
          python tools/pulse_api.py write --day "${{ steps.prep.outputs.day }}" --dir "$RUNNER_TEMP/w/out/output/pulse" --radar "$RUNNER_TEMP/radar"

      - name: data/pulse-api 에 올리기(고아 커밋 하나 · 강제)
        if: steps.prep.outputs.skip != '1'
        run: |
          set -euo pipefail
          DAY="${{ steps.prep.outputs.day }}"
          W="$RUNNER_TEMP/w"
          rm -rf "$W/api/$DAY"
          cp -r "$W/out/output/pulse/$DAY" "$W/api/$DAY"
          {
            echo "# data/pulse-api — 자동 생성(손대지 않는다)"
            echo
            echo "- 만든 곳: .github/workflows/pulse-api.yml (main) · tools/pulse_api.py — 채널 맥박 해석을 루틴 대신 Claude API 로 쓴 판(비교 기간)"
            echo "- <날짜>/fill.json·report.md·page.html: 루틴 판(routine/pulse)과 같은 모양 · api.json: 모델·시도 횟수·토큰·달러"
            echo "- 마지막 생성: $(date '+%F %H:%M') KST · run ${GITHUB_RUN_ID}"
          } > "$W/api/README.md"
          export GIT_INDEX_FILE="$RUNNER_TEMP/api.index"
          export GIT_AUTHOR_NAME="pulse-api" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          REPO="$GITHUB_WORKSPACE/.git"
          ( cd "$W/api" && git --git-dir="$REPO" --work-tree=. add -A -f . )
          TREE=$(git --git-dir="$REPO" write-tree)
          COMMIT=$(git --git-dir="$REPO" commit-tree "$TREE" -m "data: 맥박 API 판 $DAY")
          git --git-dir="$REPO" push -f origin "$COMMIT:refs/heads/$DATA_BRANCH"
          { echo '```json'; cat "$W/api/$DAY/api.json"; echo '```'; head -40 "$W/api/$DAY/report.md"; } >> "$GITHUB_STEP_SUMMARY" || true
