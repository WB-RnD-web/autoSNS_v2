name: 사연 오디오드라마 — 대본 검사 → 여러 목소리 합성 → 장면 그림 → 롱폼 업로드

# 트리거: 사연 드라마 루틴(Sonnet 5.5)이 routine/drama(★영구 누적 브랜치)에 한 편 폴더를 push 하면 실행.
#   처리 대상 = 이 push 에서 바뀐 output/drama/<DATE>_<유형>/ 폴더.
#   ★spec.json 을 믿지 않고 장별 대본에서 다시 조립·검사한다(drama_plan.check) — 못 넘으면 올리지 않는다.
# 수동 실행 기본값은 '견본으로 경로 점검(업로드 없음)'이다.

on:
  push:
    branches:
      - "routine/drama"
    paths:
      - "output/drama/**"
  workflow_dispatch:
    inputs:
      target:
        description: "폴더 또는 spec.json 경로 (기본: 짧은 견본)"
        default: "docs/samples/drama_sample"
      no_upload:
        description: "업로드 없이 렌더만(검증) — 썸네일·자막·영상을 아티팩트로"
        type: boolean
        default: true
      allow_short:
        description: "분량 검사 생략(견본 점검용 — 업로드 없음과 함께만)"
        type: boolean
        default: true
      force_private:
        description: "비공개로 업로드(테스트)"
        type: boolean
        default: false

concurrency:
  group: drama-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # 100분 분량: 합성 ~45분(Supertonic RTF≈1, 동시 6건 ≈2.2배) + 그림 ~20분 + 인코딩 ~10분
    timeout-minutes: 200
    env:
      TZ: Asia/Seoul
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}          # 그림 폴백(FLUX)
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      DRAMA_PLAYLIST: ${{ vars.DRAMA_PLAYLIST || '사연 드라마 (전편 듣기)' }}
      DRAMA_TTS_WORKERS: ${{ vars.DRAMA_TTS_WORKERS || '6' }}
      DRAMA_TEMPO: ${{ vars.DRAMA_TEMPO || '0.92' }}
      # 한국 시니어 대상 — 영어 제목·자막 번역은 붙이지 않는다
      I18N_LOCALIZE: "0"
      I18N_CAPTIONS: "0"
    steps:
      # ★코드는 항상 main 에서 — routine/drama 는 '영구 누적' 브랜치라 코드가 낡는다.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: routine/drama 대본 가져오기(데이터만)
        run: |
          git fetch origin routine/drama 2>/dev/null && git checkout FETCH_HEAD -- output/drama/ \
            || echo "(routine/drama 에 output/drama 없음)"
          ls -d output/drama/*/ 2>/dev/null | tail -5 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: 시스템 의존성 설치
        run: |
          set -e
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if [ -n "$NEED" ]; then sudo apt-get update && sudo apt-get install -y $NEED; fi
          python -m pip install -r pipeline/requirements.txt
          df -h . | tail -1

      - name: ledger 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: output/drama_ledger.json
          key: drama-ledger-${{ github.run_id }}
          restore-keys: drama-ledger-

      - name: YouTube 자격증명(같은 채널 확장 스코프 토큰)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p pipeline/secrets
          [ -n "$YT_CLIENT_SECRET_JSON" ] && printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
          elif [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token_novel.json
          else
            echo "⚠️ 업로드 토큰 없음 — 렌더만 진행"
          fi

      - name: 처리 대상 결정
        id: pick
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.target }}"
          else
            BEFORE="${{ github.event.before }}"; AFTER="${{ github.event.after }}"
            git fetch -q origin routine/drama
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="$AFTER~1 $AFTER"
            else
              RANGE="$BEFORE $AFTER"
            fi
            T=$(git diff --name-only --diff-filter=AM $RANGE -- output/drama/ 2>/dev/null \
                | awk -F/ 'NF>=4{print $1"/"$2"/"$3}' | sort -u | tr '\n' ' ' || true)
          fi
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          echo "대상: '$T'"

      - name: 렌더 + 업로드
        run: |
          T="${{ steps.pick.outputs.targets }}"
          if [ -z "$(echo $T | tr -d ' ')" ]; then echo "새 회차 없음 — 종료"; exit 0; fi
          cd pipeline
          python run_drama.py $(for f in $T; do echo "../$f"; done) \
            --ledger-path ../output/drama_ledger.json --log ../output/drama_log.json \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.no_upload }}" = "true" ] && echo --no-upload) \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.allow_short }}" = "true" ] && echo --allow-short) \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_private }}" = "true" ] && echo --force-private)

      - name: 검증 산출물(썸네일·자막·영상)
        if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.no_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drama-preview-${{ github.run_number }}
          path: |
            output/renders/*_drama_thumb.jpg
            output/renders/*_drama.srt
            output/drama_log.json
            ${{ github.event.inputs.allow_short == 'true' && 'output/renders/*_drama.mp4' || '' }}
          retention-days: 3
          if-no-files-found: warn
