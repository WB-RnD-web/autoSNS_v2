name: 2027 정미년 롱폼 대본(API) — 루틴 대신 Claude API 로 쓰기 → routine/fortune_lf27

# 2026-11-07: 클라우드 루틴 '2027 정미년 깊이 보기 롱폼 루틴'(trig_01HtELyY…, 월·수·토 10:07 KST)을 옮겼다.
#   next → 글쓰기 안내·견본으로 쓰기 → check 통과 → routine/fortune_lf27 push 까지 같다(tools/lf27_api.py).
#   push 는 GH_PAT — GITHUB_TOKEN 으로 push 하면 fortune-lf27.yml(렌더·예약 업로드)이 안 깨어난다.
# 끄기: 레포 변수 LF27_API=0. 모델: LF27_MODEL(기본 claude-opus-5-5).
on:
  schedule:
    - cron: "7 1 * * 1,3,6"     # 10:07 KST 월·수·토(옛 루틴과 같은 시각)
  workflow_dispatch:
    inputs:
      dry:
        description: "push 하지 않고 쓰기·검사만"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lf27-api
  cancel-in-progress: false

jobs:
  write:
    if: (vars.LF27_API || '1') != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      LF27_MODEL: ${{ vars.LF27_MODEL || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -q anthropic

      - name: 쓰기 → 검사 → push(한 번에 최대 두 편)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PAT: ${{ secrets.GH_PAT }}
          DRY: ${{ inputs.dry && '1' || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PAT" ] && [ -z "$DRY" ]; then echo "::error::GH_PAT 시크릿이 없다 — 멈춘다"; exit 1; fi
          for round in 1 2; do
            git fetch -q origin
            git checkout -q -B routine/fortune_lf27 origin/main
            python tools/lf27_api.py write --env "$RUNNER_TEMP/lf27.env"
            . "$RUNNER_TEMP/lf27.env"          # EPISODE · FILE · MORE
            if [ "$EPISODE" = "NONE" ]; then break; fi
            git add -f "$FILE"
            git -c user.name="2027 롱폼 API" -c user.email="fortune-lf27-api@users.noreply.github.com" \
                commit -q -m "chore: 2027 정미년 깊이 보기 대본(API) $EPISODE"
            if git rev-parse -q --verify origin/routine/fortune_lf27 >/dev/null; then
              git -c user.name="2027 롱폼 API" -c user.email="fortune-lf27-api@users.noreply.github.com" \
                  merge -s ours --no-edit origin/routine/fortune_lf27
            fi
            if [ -n "$DRY" ]; then echo "dry — push 안 함: $EPISODE $FILE"; break; fi
            git push origin routine/fortune_lf27
            [ "$(git ls-remote origin refs/heads/routine/fortune_lf27 | cut -f1)" = "$(git rev-parse HEAD)" ] \
              || { echo "::error::push 확인 실패"; exit 1; }
            echo "✅ $EPISODE → routine/fortune_lf27"
            [ "${MORE:-0}" -gt 0 ] || break
          done
