name: Nine Tails Tales — 수면판(Sleep Edition) · 지난 편을 다시 지어 한 시간짜리 → 예약 업로드

# 매일 한 번 깨서 할 일(due)을 본다: gumiho/tales/sleep/*.json 중 render_from 이 지났고 · 대본이 다 있고 · 아직 안 올린 것.
#   할 일이 없으면 1분 안에 끝난다. GitHub cron 은 가끔 늦거나 빠지지만 매일 보니 하루쯤 밀릴 뿐이다
#   (sleep.py check 가 publish_at 을 render_from 보다 이틀 이상 뒤로 강제한다).
# ★두 번 올리지 않는다: ① ledger(Actions 캐시 tales-sleep-ledger-) ② 렌더 전에 유튜브 설명란 표식 'Sleep Edition NNN' 확인
#   ③ upload 가 올리기 직전에 한 번 더 확인.
# ★tales.yml 의 ledger 는 쓰지 않는다 — 그쪽은 routine/tales 브랜치 캐시라 main 에서 못 읽는다. 본편 링크는
#   uploaded.json → 채널 업로드 목록(제목)에서 찾는다.
# 분량(한 시간): 목소리 ~30분 + 그림 ~200장 ~60분(Spark 대기열 없을 때) + 프레임 15fps ~50분 + 업로드.
# ★돈 드는 호출 없음: Spark · NVIDIA 무료 키(그림 폴백) · 퍼블릭 레포 Actions 뿐.

on:
  schedule:
    - cron: "41 3 * * *"        # 매일 12:41 KST
  workflow_dispatch:
    inputs:
      spec:
        description: "수면판 spec 경로(비우면 due 판정)"
        default: ""
      upload:
        description: "업로드(TALES_PUBLISH 방식). 끄면 렌더만 — 결과(영상 포함)는 아티팩트"
        type: boolean
        default: false

concurrency:
  group: tales-sleep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      TZ: Asia/Seoul
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      TALES_TTS_WORKERS: "2"
      GUMIHO_SPARK_MAX_WAITING: "6"
      TALES_PUBLISH: ${{ vars.TALES_PUBLISH || 'private' }}
      PYTHONIOENCODING: utf-8
    steps:
      # ★코드는 항상 main 에서, 대본은 routine/tales 에서(데이터만)
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: routine/tales 대본 가져오기(데이터만)
        run: |
          git fetch -q --depth=1 origin routine/tales 2>/dev/null && git checkout FETCH_HEAD -- output/tales/ \
            || echo "(routine/tales 에 output/tales 없음)"
          ls output/tales/ 2>/dev/null | tail -8 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: ledger 복원(수면판 전용)
        uses: actions/cache/restore@v4
        with:
          path: output/gumiho/sleep_ledger.json
          key: tales-sleep-ledger-${{ github.run_id }}
          restore-keys: tales-sleep-ledger-

      - name: 할 일 고르기
        id: pick
        run: |
          set -e
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            T="${{ github.event.inputs.spec }}"
          else
            T=$(python gumiho/tales/sleep.py due | head -1)
          fi
          echo "target=$T" >> "$GITHUB_OUTPUT"
          echo "대상: '${T:-없음}'"

      - name: 시스템 의존성
        if: steps.pick.outputs.target != ''
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-nanum
          python -m pip install -r pipeline/requirements.txt numpy

      - name: 테스트(오프라인)
        if: steps.pick.outputs.target != ''
        run: |
          python gumiho/tales/test_sleep.py
          python gumiho/tales/sleep.py check "${{ steps.pick.outputs.target }}"

      - name: YouTube 자격증명(Gumiho 채널 전용 토큰)
        id: cred
        if: steps.pick.outputs.target != '' && (github.event_name == 'schedule' || github.event.inputs.upload == 'true')
        env:
          YT_TOKEN_JSON_GUMIHO: ${{ secrets.YT_TOKEN_JSON_GUMIHO }}
        run: |
          mkdir -p pipeline/secrets
          if [ -z "$YT_TOKEN_JSON_GUMIHO" ]; then echo "::error::시크릿 YT_TOKEN_JSON_GUMIHO 없음"; exit 1; fi
          printf '%s' "$YT_TOKEN_JSON_GUMIHO" > pipeline/secrets/token_gumiho.json

      - name: 유튜브에 이미 있나(세 시간 렌더 전에)
        id: seen
        if: steps.cred.outcome == 'success'
        env:
          YT_TOKEN_NOVEL: pipeline/secrets/token_gumiho.json
        run: |
          if python gumiho/tales/sleep.py seen "${{ steps.pick.outputs.target }}"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: 렌더
        if: steps.pick.outputs.target != '' && steps.seen.outputs.skip != '1'
        run: python gumiho/tales/sleep.py render "${{ steps.pick.outputs.target }}" --procs 4

      - name: 업로드
        if: steps.cred.outcome == 'success' && steps.seen.outputs.skip != '1'
        env:
          YT_TOKEN_NOVEL: pipeline/secrets/token_gumiho.json
        run: python gumiho/tales/sleep.py upload "${{ steps.pick.outputs.target }}"

      # 올라간 건 올라간 거다 — 잡이 실패해도 ledger 는 남긴다(다음 날 두 번 올리지 않게)
      - name: ledger 저장
        if: always() && hashFiles('output/gumiho/sleep_ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/gumiho/sleep_ledger.json
          key: tales-sleep-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 결과물(썸네일·한눈에 보기·자막·메타 — 렌더만 한 경우 영상까지)
        if: always() && steps.pick.outputs.target != ''
        uses: actions/upload-artifact@v4
        with:
          name: tales-sleep-${{ github.run_number }}
          path: |
            output/gumiho/tales/sleep_*_thumb.jpg
            output/gumiho/tales/sleep_*_sheet.jpg
            output/gumiho/tales/sleep_*.srt
            output/gumiho/tales/sleep_*_meta.json
            output/gumiho/sleep_ledger.json
            ${{ steps.cred.outcome != 'success' && 'output/gumiho/tales/sleep_*.mp4' || '' }}
          retention-days: 3
          if-no-files-found: warn
