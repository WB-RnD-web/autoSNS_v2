name: 미아 산출물 자동 복구 (claude/* → routine/*)

# 왜 있나 — 2026-09-10.
#   루틴 세션에는 `claude/…` 브랜치에서 개발하라는 지시가 자동으로 주입된다. 그게 루틴
#   프롬프트의 `routine/<토픽>` push 지시와 충돌하는데, ★어느 쪽이 이기는지가 회차마다 다르다.
#   루틴 7개의 설정은 전부 동일한데도 같은 루틴이 어제는 맞고 오늘은 틀린다.
#   09-02 에 프롬프트를 고쳐봤지만 09-07·09-09·09-10 또 터졌다 — 지시로는 못 고친다.
#   그래서 지시에 기대지 않고, 샌 산출물을 결정론적으로 제자리에 돌려놓는다.
#
# ⚠️ shorts.yml 트리거에 `claude/**` 를 추가하는 방식은 여전히 ★쓰지 않는다.
#    그러면 사람의 개발 브랜치에서도 영상이 실제로 업로드된다.
#    이 워크플로는 ★옮기기만 한다 — 발행은 옮겨진 곳의 push 가 트리거한다.
#
# 무엇을 옮기는지의 판단은 tools/rescue_storyboard.py 에 있다(테스트 있음).
# 요지: 커밋이 ★산출물만 담고 있을 때만 건드린다. 코드가 섞이면 사람 커밋으로 보고 둔다.

on:
  push:
    branches:
      - "claude/**"          # 루틴이 잘못 밀어넣는 곳
    paths:                   # 산출물이 실제로 올라온 push 만
      - "output/news/**_storyboard.json"
      - "output/scp/**.json"

# GITHUB_TOKEN 은 ★읽기만. push 는 아래 checkout 이 심어둔 PAT 으로 나간다.
#   (permissions 는 GITHUB_TOKEN 의 권한이지 PAT 의 권한이 아니다 — 최소 권한을 유지한다)
permissions:
  contents: read

concurrency:
  group: orphan-rescue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rescue:
    # 끄고 싶으면 레포 변수 ORPHAN_RESCUE=0
    if: vars.ORPHAN_RESCUE != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # cherry-pick 하려면 역사가 필요하다
          # ★GITHUB_TOKEN 으로 push 하면 워크플로가 트리거되지 않는다(GitHub 정책).
          #   그러면 파일만 옮겨지고 영상은 안 만들어져 ★새로운 조용한 고장이 된다.
          #   그래서 PAT 로 푸시한다. refresh-tokens.yml 이 쓰는 것과 같은 시크릿.
          token: ${{ secrets.GH_PAT || github.token }}
          persist-credentials: true

      - name: PAT 확인 (없으면 옮기지 않고 시끄럽게 실패한다)
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::error::GH_PAT 시크릿이 없다 — 옮기지 않고 멈춘다."
            echo ""
            echo "  GITHUB_TOKEN 으로 push 하면 routine/* 의 워크플로가 트리거되지 않는다."
            echo "  파일만 옮겨지고 영상은 안 만들어지는 ★조용한 고장이 되므로, 반쪽 복구는 하지 않는다."
            echo "  GH_PAT(repo 권한)을 넣거나, 아래 명령으로 손으로 옮겨라."
            echo "  (미아 목록과 복구 명령은 orphan-check.yml 로그에 매일 찍힌다)"
            exit 1
          fi

      - name: 원격 브랜치 전부 가져오기
        run: git fetch origin "+refs/heads/*:refs/remotes/origin/*" --prune

      - name: 무엇을 어디로 옮길지 계산
        id: plan
        run: |
          python3 tools/rescue_storyboard.py \
            --before "${{ github.event.before }}" \
            --after  "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --out    "$RUNNER_TEMP/plan.tsv"
          echo "count=$(wc -l < "$RUNNER_TEMP/plan.tsv" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: routine/* 로 되돌리기
        if: steps.plan.outputs.count != '0'
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          RC=0
          while IFS=$'\t' read -r SHA FILE TARGET; do
            [ -n "${SHA:-}" ] || continue
            echo "── $FILE → $TARGET"

            # 목적지가 없으면 main 에서 새로 만든다(첫 회차 토픽).
            if git rev-parse --verify -q "origin/$TARGET" >/dev/null; then
              git checkout -q -B _rescue "origin/$TARGET"
            else
              echo "   $TARGET 없음 — main 에서 새로 만든다"
              git checkout -q -B _rescue origin/main
            fi

            if ! git cherry-pick "$SHA"; then
              git cherry-pick --abort || true
              echo "::error::$FILE cherry-pick 실패 — 손으로 옮겨야 한다"
              RC=1
              continue
            fi

            if git push origin "HEAD:$TARGET"; then
              echo "   ✅ $TARGET 로 옮겼다 — 발행 워크플로가 이 push 로 트리거된다"
            else
              echo "::error::$TARGET push 실패"
              RC=1
            fi
          done < "$RUNNER_TEMP/plan.tsv"

          echo ""
          if [ "$RC" -ne 0 ]; then
            echo "일부 복구가 실패했다 — 위 오류를 보라."
          else
            echo "복구 완료. 원본 $GITHUB_REF_NAME 는 그대로 둔다(지우지 않는다)."
          fi
          exit $RC

      - name: 옮길 게 없었음
        if: steps.plan.outputs.count == '0'
        run: |
          echo "이 push 에는 옮길 루틴 산출물이 없다 — 정상이다."
          echo "(사람이 개발 브랜치에서 코드와 함께 커밋한 경우가 여기로 온다)"
