name: SCP 아카이브(주 1회) → 다장면 롱폼(16:9) → 유튜브(+재생목록)

# 트리거: 루틴이 새 SCP 스펙을 routine/scp(★영구 누적 브랜치)에 push 하면 실행.
#   처리 대상 = 이 push 에서 ★새로 추가된 output/scp/*.json (git diff). library.json 은 제외.
#
# ⚠️ 루프 가드(다른 파이프라인과 동일): permissions read — 레포에 산출물 커밋 안 함.
#   상태 파일(scp/library.json)은 '루틴'이 쓰는 것이지 파이프라인이 쓰지 않는다.
#   ★브랜치 리셋 금지: push 된 ref 를 그대로 체크아웃(누적 보존).

on:
  push:
    branches:
      - "routine/scp"
    paths:
      - "output/scp/**"
  workflow_dispatch:
    inputs:
      spec:
        description: "처리할 스펙 JSON 경로(비우면 신규/전체 자동 탐색)"
        default: ""
      force_private:
        description: "privacy 강제 private (수동 테스트 옵트인)"
        type: boolean
        default: false
      no_upload:
        description: "업로드 없이 렌더만(검증)"
        type: boolean
        default: false

concurrency:
  group: scp-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # 낭독 ~8분 · 장면 이미지 N장(FLUX) · 10fps ultrafast 인코딩 → 여유 있게 45분.
    timeout-minutes: 45
    env:
      TZ: Asia/Seoul
      # ★다국어: 제목·설명 현지화(50 units) + 번역 자막 트랙(400 units/언어).
      #   자막 트랙은 편수가 적은 SCP 에만 건다(금 1편 + 토 1편). 끄려면 vars 로 0.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
      I18N_LOCALIZE: ${{ vars.I18N_LOCALIZE || '1' }}
      I18N_CAPTIONS: ${{ vars.I18N_CAPTIONS || '1' }}
      I18N_LANGS: ${{ vars.I18N_LANGS || 'en,ja,zh-Hant' }}
      # 장면/썸네일 이미지(FLUX klein-4b, 소설·ASMR 과 동일 엔드포인트)
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # 낭독 보이스(차분한 아카이브 톤)
      STORY_VOICE: ${{ vars.SCP_VOICE || 'ko-KR-InJoonNeural' }}
      # 렌더 노브: 프레임수=인코딩시간. 정지 장면이라 10fps 로 충분(전환 1.2s=12프레임).
      SCP_FPS: ${{ vars.SCP_FPS || '10' }}
      SCP_XFADE: ${{ vars.SCP_XFADE || '1.2' }}
      SCP_MAX_SCENES: ${{ vars.SCP_MAX_SCENES || '8' }}
      SCP_MIN_SCENE_SEC: ${{ vars.SCP_MIN_SCENE_SEC || '25' }}
      # 재생목록 이름 고정(비우면 스펙의 playlist 사용)
      SCP_PLAYLIST: ${{ vars.SCP_PLAYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      # 이미 있는 건 설치하지 않는다 — apt-get update 가 미러 상태에 따라 수 분씩
      # 걸리는 사고가 있었다(2026-08-06 asmr: 이 스텝에만 9분 28초).
      - name: 시스템 의존성 설치
        run: |
          set -e
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if [ -n "$NEED" ]; then
            echo "apt 설치 대상:$NEED"
            sudo apt-get update
            sudo apt-get install -y $NEED
          else
            echo "시스템 의존성 이미 충족 — apt 스킵"
          fi
          python -m pip install -r pipeline/requirements.txt

      # dedupe ledger(주차 단위) 복원/저장 — 런 간 영속, 레포에 쓰지 않음
      - name: ledger 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: output/scp_ledger.json
          key: scp-ledger-${{ github.run_id }}
          restore-keys: scp-ledger-

      - name: YouTube 자격증명(같은 채널 → 확장 스코프 token_novel 재사용)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_JSON_FORCESSL: ${{ secrets.YT_TOKEN_JSON_FORCESSL }}
        run: |
          mkdir -p pipeline/secrets
          if [ -n "$YT_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          fi
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
            echo "확장 스코프 토큰 사용(재생목록 가능)"
          elif [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token_novel.json
            echo "쇼츠 토큰 폴백(재생목록은 스코프 부족 시 자동 스킵)"
          else
            echo "⚠️ 업로드 토큰 없음 — 렌더만 진행"
          fi
          # ★자막 트랙(captions API)은 youtube.force-ssl 스코프가 필수다. 없으면 자동 스킵.
          if [ -n "$YT_TOKEN_JSON_FORCESSL" ]; then
            printf '%s' "$YT_TOKEN_JSON_FORCESSL" > pipeline/secrets/token_forcessl.json
            echo "force-ssl 토큰 준비됨 — 번역 자막 트랙 업로드 가능"
          fi

      - name: 처리 대상 결정
        id: pick
        run: |
          set -e
          SP="${{ github.event.inputs.spec }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$SP" ]; then
            FILES="$SP"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"; AFTER="${{ github.event.after }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1 HEAD"
            else
              RANGE="$BEFORE $AFTER"
            fi
            FILES=$(git diff --name-only --diff-filter=AM $RANGE -- output/scp/ 2>/dev/null \
                    | grep -E '\.json$' | grep -v library.json | tr '\n' ' ' || true)
          else
            FILES=$(find output/scp -type f -name '*.json' 2>/dev/null | grep -v library.json | tr '\n' ' ' || true)
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "선정된 파일: '$FILES'"

      - name: 렌더 + 업로드
        run: |
          FILES="${{ steps.pick.outputs.files }}"
          if [ -z "$(echo $FILES | tr -d ' ')" ]; then
            echo "처리할 신규 SCP 스펙 없음 — 종료."
            exit 0
          fi
          cd pipeline
          python run_scp.py $(for f in $FILES; do echo "../$f"; done) \
            --use-ledger --ledger-path ../output/scp_ledger.json --log ../output/scp_log.json \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_private }}" = "true" ] && echo --force-private) \
            $([ "${{ github.event.inputs.no_upload }}" = "true" ] && echo --no-upload)
