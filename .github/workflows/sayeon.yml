name: 사연(sayeon) 라디오 → 낭독 오디오북(16:9) → 유튜브(+재생목록)

# 트리거: 루틴이 새 사연 스펙을 routine/sayeon(★영구 누적 브랜치)에 push 하면 실행.
#   처리 대상 = 이 push 에서 ★새로 추가된 output/sayeon/*.json (git diff).
# ⚠️ 루프 가드: permissions read — 산출물은 유튜브로만. 브랜치 리셋 금지(상태파일 보존).

on:
  push:
    branches:
      - "routine/sayeon"
    paths:
      - "output/sayeon/**"
  workflow_dispatch:
    inputs:
      spec:
        description: "처리할 스펙 JSON 경로(비우면 신규/전체 자동 탐색)"
        default: ""
      force_private:
        description: "privacy 강제 private (수동 테스트 옵트인)"
        type: boolean
        default: false
      no_upload:
        description: "업로드 없이 렌더만(검증)"
        type: boolean
        default: false

concurrency:
  group: sayeon-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 실측 최대 17분
    env:
      TZ: Asia/Seoul
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # 낭독 보이스(차분한 라디오 톤) — 필요 시 vars 로 조정
      STORY_VOICE: ${{ vars.SAYEON_VOICE || 'ko-KR-InJoonNeural' }}
      # 재생목록 이름 고정(선택). 비우면 스펙의 playlist 이름 사용. 없으면 자동 생성.
      STORY_PLAYLIST: ${{ vars.SAYEON_PLAYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: 시스템 의존성 설치
        run: |
          set -e
          # 이미 있는 건 설치하지 않는다 — apt-get update 가 미러 상태에 따라
          # 수 분씩 걸리는 사고가 있었다(2026-08-06 asmr: 이 스텝에만 9분 28초).
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if [ -n "$NEED" ]; then
            echo "apt 설치 대상:$NEED"
            sudo apt-get update
            sudo apt-get install -y $NEED
          else
            echo "시스템 의존성 이미 충족 — apt 스킵"
          fi
          python -m pip install -r pipeline/requirements.txt

      - name: ledger 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: output/sayeon_ledger.json
          key: sayeon-ledger-${{ github.run_id }}
          restore-keys: sayeon-ledger-

      - name: YouTube 자격증명(같은 채널 → 확장 스코프 token_novel 재사용)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p pipeline/secrets
          if [ -n "$YT_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          fi
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
          elif [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token_novel.json
          fi

      - name: 처리 대상 결정
        id: pick
        run: |
          set -e
          SP="${{ github.event.inputs.spec }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$SP" ]; then
            FILES="$SP"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"; AFTER="${{ github.event.after }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1 HEAD"
            else
              RANGE="$BEFORE $AFTER"
            fi
            FILES=$(git diff --name-only --diff-filter=AM $RANGE -- output/sayeon/ 2>/dev/null \
                    | grep -E '\.json$' | grep -v library.json | tr '\n' ' ' || true)
          else
            FILES=$(find output/sayeon -type f -name '*.json' 2>/dev/null | grep -v library.json | tr '\n' ' ' || true)
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "선정된 파일: '$FILES'"

      - name: 렌더 + 업로드
        run: |
          FILES="${{ steps.pick.outputs.files }}"
          if [ -z "$(echo $FILES | tr -d ' ')" ]; then
            echo "처리할 신규 사연 스펙 없음 — 종료."
            exit 0
          fi
          cd pipeline
          python run_story.py --topic sayeon $(for f in $FILES; do echo "../$f"; done) \
            --use-ledger --ledger-path ../output/sayeon_ledger.json --log ../output/sayeon_log.json \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_private }}" = "true" ] && echo --force-private) \
            $([ "${{ github.event.inputs.no_upload }}" = "true" ] && echo --no-upload)
