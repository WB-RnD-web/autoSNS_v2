name: 인스타 대본(API) — 루틴 대신 Claude API 로 쓰기 · 지금은 나란히 비교(data/insta-api)

# 2026-10-31 사용자: Max 계정마다 따로 붙는 월 200달러 API 크레딧을 쓰고, 구독 주간 한도(루틴·세션이 같이 쓴다)는 아끼자.
#   인스타 대본 루틴(하루 두 번 · Sonnet)이 하던 일을 insta/pick_api.py 가 API 한 번(+검사 오류 때 다시)으로 한다.
#   편·꼴·항목 = pick_plan.next_info · 쓰는 법 = next 의 writing 파일 · 모양 = exemplar · 검사 = pick_reel.check — 루틴과 같다.
# ★지금은 비교 기간: 루틴 대본이 렌더·게시된 뒤(insta-pick.yml 이 끝나면) 같은 편을 API 로 다시 써서 data/insta-api 에만 쌓는다.
#   게시·routine/insta_pick 은 건드리지 않는다(루틴이 계속 쓴다). 며칠 견줘 보고 괜찮으면 다음 PR 에서 실제 대본으로 바꾸고 루틴을 끈다.
# 같은 편을 두 번 쓰지 않는다(data/insta-api/<날짜>/api_<편>.json 이 있으면 건너뛴다).
# 비용: api_<편>.json 에 실제 토큰·달러. 크레딧이 바닥나면 API 가 거절할 뿐 돈은 안 나간다(결제 수단 없음).
# ⚠️ main·routine/* 에는 아무것도 올리지 않는다 — data/insta-api 에 고아 커밋 하나로 강제(트렌드 레이더와 같은 방식).
# 시험: api-test/insta 브랜치에 올리면 그 브랜치 코드로 한 번 돈다(오늘 가장 늦은 편 · 업로드 워크플로는 이 브랜치를 안 본다).

on:
  workflow_run:
    workflows: ["인스타 오늘의 골라보기 — 대본 검사 → 그림·목소리(Spark) → 릴스 렌더 → 게시"]
    types: [completed]
  workflow_dispatch:
  push:
    branches:
      - "api-test/insta"

permissions:
  contents: write

concurrency:
  group: insta-api
  cancel-in-progress: false

jobs:
  write:
    # 루틴 대본 push 로 돈 게시 실행만 따라간다(수동 렌더 시험은 따라가지 않는다)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      DATA_BRANCH: data/insta-api
      INSTA_MODEL: ${{ vars.INSTA_MODEL || 'claude-opus-5-5' }}
      INSTA_EFFORT: ${{ vars.INSTA_EFFORT || 'high' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: python -m pip install -q anthropic pillow numpy

      - name: 테스트(오프라인)
        run: python insta/test_pick_api.py

      - name: 오늘·지난 대본 받기
        id: prep
        run: |
          set -euo pipefail
          DAY=$(date +%F)
          W="$RUNNER_TEMP/w"
          mkdir -p "$W/api" "$W/scripts"
          if git fetch -q --no-tags --depth=1 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"; then
            git archive "origin/$DATA_BRANCH" | tar -x -C "$W/api"
          fi
          if git fetch -q --no-tags --depth=1 origin routine/insta_pick; then git archive FETCH_HEAD output/insta_pick | tar -x -C "$W/scripts" || true; fi
          mkdir -p "$W/scripts/output/insta_pick"
          SLOT=$(python -c "import sys, datetime as d; sys.path.insert(0, 'insta'); import pick_api as A; print(A.target_slot(d.date.fromisoformat('$DAY'), '$W/scripts/output/insta_pick')[0] or '')")
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          if [ -z "$SLOT" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "::notice::오늘 대본이 아직 없다"; exit 0; fi
          if [ -f "$W/api/$DAY/api_$SLOT.json" ] && [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::오늘 $SLOT 편은 이미 썼다 — 건너뛴다"
          fi

      - name: 대본(Claude API)
        if: steps.prep.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::시크릿 ANTHROPIC_API_KEY 없음"; exit 1; fi
          python insta/pick_api.py write --date "${{ steps.prep.outputs.day }}" --scripts "$RUNNER_TEMP/w/scripts/output/insta_pick" --out "$RUNNER_TEMP/w/api/${{ steps.prep.outputs.day }}"

      - name: data/insta-api 에 올리기(고아 커밋 하나 · 강제)
        if: steps.prep.outputs.skip != '1'
        run: |
          set -euo pipefail
          DAY="${{ steps.prep.outputs.day }}"
          W="$RUNNER_TEMP/w"
          {
            echo "# data/insta-api — 자동 생성(손대지 않는다)"
            echo
            echo "- 만든 곳: .github/workflows/insta-api.yml (main) · insta/pick_api.py — 인스타 대본을 루틴 대신 Claude API 로 쓴 판(비교 기간 · 게시 안 함)"
            echo "- <날짜>/<대본>.json = API 판 · routine_<대본>.json = 같은 편 루틴 판(실제로 게시된 것) · api_<편>.json = 모델·시도·토큰·달러"
            echo "- 마지막 생성: $(date '+%F %H:%M') KST · run ${GITHUB_RUN_ID}"
          } > "$W/api/README.md"
          export GIT_INDEX_FILE="$RUNNER_TEMP/api.index"
          export GIT_AUTHOR_NAME="insta-api" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          REPO="$GITHUB_WORKSPACE/.git"
          ( cd "$W/api" && git --git-dir="$REPO" --work-tree=. add -A -f . )
          TREE=$(git --git-dir="$REPO" write-tree)
          COMMIT=$(git --git-dir="$REPO" commit-tree "$TREE" -m "data: 인스타 대본 API 판 $DAY ${{ steps.prep.outputs.slot }}")
          git --git-dir="$REPO" push -f origin "$COMMIT:refs/heads/$DATA_BRANCH"
          { echo '```json'; cat "$W/api/$DAY/api_${{ steps.prep.outputs.slot }}.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
