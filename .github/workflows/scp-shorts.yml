name: SCP 쇼츠 → 롱폼 완료 시 자동 → 9:16 쇼츠 → 유튜브

# ★롱폼(scp.yml)이 ★같은 런에서 이 워크플로를 직접 호출한다(workflow_call). 스케줄이 없다.
#   루틴을 주 1회로 돌리든 매일로 돌리든 ★쇼츠가 알아서 따라온다 — cron 을 다시 맞출 필요가 없다.
#   같은 스펙 JSON 을 읽으므로 쇼츠 전용 루틴도 없다.
#   쇼츠는 롱폼의 예고편 — 반전은 안 말하고 '전편 보러가기'로 닫는다(루틴 프롬프트 §2.6).
#
# ⚠️ 왜 cron 이 아닌가(이유는 workflow_call 로 바꾼 지금도 그대로다):
#   ① 발행 주기를 바꿀 때마다 cron 을 고칠 필요가 없다(루틴만 바꾸면 따라온다).
#   ② 롱폼이 ★성공했을 때만 돈다 — 롱폼이 깨진 날 쇼츠만 헛도는 일이 없다.
#   ③ 롱폼 업로드 직후라 run_scp_shorts 의 find_longform_url 이 '전편'을 바로 찾는다.
#      (쇼츠는 렌더에 몇 분 걸린 뒤 조회하므로 uploads 재생목록 반영 시간도 자연히 확보된다)
#   롱폼이 ledger 로 스킵된 경우에도 이 워크플로는 돈다 — 쇼츠만 빠졌던 날을 메우는 복구 경로가 된다
#   (쇼츠도 이미 만들었으면 쇼츠 ledger 가 다시 스킵한다).
#
# ⚠️ 브랜치 구조가 롱폼(scp.yml)과 다르다:
#   스케줄 워크플로는 ★기본 브랜치(main)에서만 실행된다. 그런데 스펙 JSON 은
#   routine/scp(영구 누적 브랜치)에 있다. 그래서
#     - 코드(pipeline/**) = main 체크아웃
#     - 데이터(output/scp/*.json) = routine/scp 에서 그 경로만 가져오기
#   로 나눈다. routine/scp 를 통째로 체크아웃하면 파이프라인 코드가 옛날 것이 된다.
#
# ⚠️ 루프 가드: permissions read — 레포에 아무것도 커밋하지 않는다.

on:
  # ★롱폼(scp.yml)이 ★같은 런 안에서 이 워크플로를 직접 호출한다(workflow_call).
  #
  # ⚠️⚠️ 왜 workflow_run 을 버렸나 (2026-08-28)
  #   #46 에서 워크플로 이름을 맞추고, 그 뒤 routine/scp 의 워크플로 파일도 main 과
  #   동기화했다. 그런데도 ★쇼츠는 한 번도 안 걸렸다.
  #     08-28 08:26 롱폼 run #8 성공 · name 도 정확히 일치 · 그래도 쇼츠 0건
  #   이름을 배제하고 나면 남는 변수는 ★브랜치다 — 롱폼은 routine/scp(비-기본 브랜치)에서
  #   돌기 때문에 workflow_run 이 발동하지 않는 것으로 보인다.
  #   (문서로 확정하지는 못했다. 다만 어느 쪽이든 workflow_run 은 우리 구조에 안 맞는다.)
  #
  #   → 이름 문자열 계약도, 브랜치 조건도 없는 ★workflow_call 로 바꾼다.
  #     호출부는 scp.yml 의 `shorts` job 이며 `@main` 으로 고정돼 있어
  #     routine/scp 가 또 낡아도 ★항상 main 의 이 파일이 실행된다.
  #     그리고 롱폼과 ★같은 런에 표시되므로 실패가 조용히 묻히지 않는다.
  workflow_call:
    inputs:
      spec:
        description: "처리할 스펙 JSON 경로(비우면 output/scp 에서 최신 1개 자동 선택)"
        type: string
        default: ""
      force_private:
        description: "privacy 강제 private"
        type: boolean
        default: false
      no_upload:
        description: "업로드 없이 렌더만(검증)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      spec:
        description: "처리할 스펙 JSON 경로(비우면 output/scp 에서 최신 1개 자동 선택)"
        default: ""
      force_private:
        description: "privacy 강제 private (수동 테스트 옵트인)"
        type: boolean
        default: false
      no_upload:
        description: "업로드 없이 렌더만(검증)"
        type: boolean
        default: false

concurrency:
  group: scp-shorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    # 롱폼 성공 여부는 ★호출부(scp.yml 의 needs:)가 판단한다 — 여기선 조건이 필요 없다.
    runs-on: ubuntu-latest
    # 대본 40~50초 · 이미지 2~3장 · 30fps 1080x1920 veryfast → 넉넉히 30분.
    # (qwen-image 가 콜드일 때 장당 최대 7분까지 기다린다)
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      # ★다국어: 번역은 '루틴이' 스펙에 써준다 → 번역 API 비용 0원.
      #   ANTHROPIC_API_KEY 는 루틴이 번역을 빠뜨렸을 때만 쓰는 ★선택적 폴백이다(없어도 정상).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
      I18N_LOCALIZE: ${{ vars.I18N_LOCALIZE || '1' }}
      I18N_CAPTIONS: ${{ vars.I18N_CAPTIONS || '1' }}
      I18N_LANGS: ${{ vars.I18N_LANGS || 'en,ja,zh-Hant' }}
      # 이미지: 자체 qwen-image(wbSpark) 우선 → 실패 시 FLUX 폴백.
      #   쇼츠는 '개체를 정면에 크게' 라 이미지 품질이 곧 조회수다. 뒤집으려면 vars 로 flux.
      SCP_SHORTS_IMG: ${{ vars.SCP_SHORTS_IMG || 'qwen' }}
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # 낭독: 롱폼과 같은 목소리, 다만 쇼츠라 조금 빠르고 간격을 좁힌다.
      # ★2026-08-31: 구형 InJoon → 신형 Hyunsu 로 교체.
      #   레포의 pipeline/voice.py 는 진작 Hyunsu 를 '신형(자연스러움)' 으로 쓰고 있었는데
      #   SCP 만 구형을 기본값으로 달고 있었다. InJoon 은 폴백으로 남긴다.
      STORY_VOICE: ${{ vars.SCP_VOICE || 'ko-KR-HyunsuMultilingualNeural' }}
      STORY_VOICE_FALLBACK: ${{ vars.SCP_VOICE_FALLBACK || 'ko-KR-InJoonNeural' }}
      STORY_RATE: ${{ vars.SCP_SHORTS_RATE || '+6%' }}
      # 쇼츠는 45초짜리라 진행률 곡선이 의미가 없다 → 끈다.
      STORY_PROSODY: ${{ vars.SCP_SHORTS_PROSODY || '0' }}
      STORY_SEG_GAP: "0.18"
      STORY_LEAD_IN: "0.25"
      STORY_TAIL: "0.9"
      # 렌더 노브
      SCP_SHORTS_FPS: ${{ vars.SCP_SHORTS_FPS || '30' }}
      SCP_SHORTS_XFADE: ${{ vars.SCP_SHORTS_XFADE || '0.6' }}
      SCP_SHORTS_MAX_SCENES: ${{ vars.SCP_SHORTS_MAX_SCENES || '3' }}
      # 재생목록: 롱폼('SCP 아카이브 …')과 분리. 비우면 스펙의 shorts.playlist 사용.
      # ★제목 계약(§2-H2) — 어긋나면 경고만 뜨고 계속 간다.
      #   빨간불로 세우려면 SCP_FAIL_ON_TITLE=1. 반응 요구 단어 목록은 쉼표로 갈아끼운다
      #   (빈 문자열이면 그 검사만 끈다).
      SCP_FAIL_ON_TITLE: ${{ vars.SCP_FAIL_ON_TITLE || '' }}
      SCP_TITLE_BANLIST: ${{ vars.SCP_TITLE_BANLIST }}
      SCP_SHORTS_PLAYLIST: ${{ vars.SCP_SHORTS_PLAYLIST }}
    steps:
      # 1) 코드는 main(기본 브랜치)에서
      #   ★ref 를 명시해야 한다. workflow_call 로 불리면 github.ref 가 ★호출한 런의
      #   브랜치(routine/scp)라서, 생략하면 그 브랜치의 낡은 파이프라인 코드를 쓴다.
      - uses: actions/checkout@v4
        with:
          ref: main

      # 2) 데이터(스펙 JSON)만 routine/scp 에서 가져온다
      - name: routine/scp 스펙 가져오기
        run: |
          set -e
          git fetch --depth=1 origin routine/scp
          git checkout FETCH_HEAD -- output/scp/ || echo "⚠️ routine/scp 에 output/scp 없음"
          ls -la output/scp/ 2>/dev/null || echo "(스펙 없음)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      # 이미 있는 건 설치하지 않는다 — apt-get update 가 미러 상태에 따라 수 분씩
      # 걸리는 사고가 있었다(2026-08-06 asmr: 이 스텝에만 9분 28초).
      - name: 시스템 의존성 설치
        run: |
          set -e
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if [ -n "$NEED" ]; then
            echo "apt 설치 대상:$NEED"
            sudo apt-get update
            sudo apt-get install -y $NEED
          else
            echo "시스템 의존성 이미 충족 — apt 스킵"
          fi
          python -m pip install -r pipeline/requirements.txt

      # 롱폼 ledger 와 ★별도 파일/별도 캐시(같은 스펙을 두 번 쓰기 때문)
      - name: ledger 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: output/scp_shorts_ledger.json
          key: scp-shorts-ledger-${{ github.run_id }}
          restore-keys: scp-shorts-ledger-

      - name: YouTube 자격증명(같은 채널 → 확장 스코프 token_novel 재사용)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_JSON_FORCESSL: ${{ secrets.YT_TOKEN_JSON_FORCESSL }}
        run: |
          mkdir -p pipeline/secrets
          if [ -n "$YT_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          fi
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
            echo "확장 스코프 토큰 사용(재생목록 + 전편 링크 조회 가능)"
          elif [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token_novel.json
            echo "쇼츠 토큰 폴백(재생목록·전편 조회는 스코프 부족 시 자동 스킵)"
          else
            echo "⚠️ 업로드 토큰 없음 — 렌더만 진행"
          fi
          # ★자막 트랙(captions API)은 youtube.force-ssl 스코프가 필수다. 없으면 자동 스킵.
          if [ -n "$YT_TOKEN_JSON_FORCESSL" ]; then
            printf '%s' "$YT_TOKEN_JSON_FORCESSL" > pipeline/secrets/token_forcessl.json
            echo "force-ssl 토큰 준비됨 — 번역 자막 트랙 업로드 가능"
          fi

      - name: 렌더 + 업로드
        run: |
          set -e
          cd pipeline
          SP="${{ inputs.spec }}"
          if [ -n "$SP" ]; then
            TARGET="../$SP"
          else
            TARGET=""
          fi
          python run_scp_shorts.py $TARGET \
            $([ -z "$TARGET" ] && echo "--latest-in ../output/scp") \
            --use-ledger --ledger-path ../output/scp_shorts_ledger.json \
            --log ../output/scp_shorts_log.json \
            $([ "${{ inputs.force_private }}" = "true" ] && echo --force-private) \
            $([ "${{ inputs.no_upload }}" = "true" ] && echo --no-upload)
