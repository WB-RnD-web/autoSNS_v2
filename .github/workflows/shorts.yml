name: 뉴스 스토리보드 → HyperFrames 쇼츠 → 유튜브 업로드 (v2)

# 트리거: 루틴이 storyboard 를 routine/* 브랜치에 push 하면 실행.
#   (루틴은 main 직접 push 불필요 → Claude Code '상승 권한' 토글 없이 일반 브랜치 push 만으로 동작)
#   브랜치는 main 에서 분기되므로 이 워크플로 파일을 그대로 포함 → 그 브랜치에서 실행됨.
#   처리 대상 = 그 시점(KST) 오늘 날짜의 output/news/<DATE>_*_storyboard.json (ledger 로 중복 스킵).
#
# ⚠️ 자기 재트리거 루프 가드:
#   - permissions: contents: read — 레포에 아무것도 커밋/푸시하지 않는다(산출물은 artifacts 로만).
#   - 산출물(mp4/assets/renders)은 .gitignore 처리 → 애초에 커밋 대상 아님.
#   - 트리거가 routine/* 인데 워크플로는 push 를 안 하므로 루프 없음. (main 직접 push 도 안 일어남)

on:
  push:
    branches:
      - "routine/**"      # 루틴 전용 브랜치(예: routine/2026-06-26_politics)
      - main              # (선택) main 에 storyboard 가 올라오면도 처리
    paths:
      - "output/news/**_storyboard.json"
  workflow_dispatch:
    inputs:
      storyboard:
        description: "처리할 스토리보드 경로(비우면 오늘 날짜 자동 탐색). 예: docs/samples/2026-06-26_economy_storyboard.json"
        default: ""
      force_private:
        description: "privacy 강제 private (테스트 안전장치)"
        type: boolean
        default: true
      no_upload:
        description: "업로드 없이 영상만 생성(렌더 검증용)"
        type: boolean
        default: false

# 동시 실행 1개로 제한(중복 푸시 안전)
concurrency:
  group: shorts-v2
  cancel-in-progress: false

permissions:
  contents: read          # ⚠️ write 아님 — 레포에 커밋하지 않는다(루프 방지)

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # 실측 최대 14분(커버 타임아웃 180s 포함 최악 ~20분)
    env:
      TZ: Asia/Seoul
      DEFAULT_PRIVACY: ${{ vars.DEFAULT_PRIVACY || 'private' }}
      # 장면 스펙 자동 추출에 사용(없으면 output/specs/ 사전 스펙 필요)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
      # IG Reels + Threads (자격증명 있을 때만 동작 — 없으면 자동 스킵)
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      # IG/Threads 미리보기 커버(9:16) 생성용 qwen-image 게이트웨이(소설과 동일).
      #   TOKEN 은 게이트웨이 인증 걸면 사용. 느리면 영상 프레임 폴백(검은 미리보기 방지).
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      # 커버 생성 노브(선택): 끄기=SHORTS_COVER=0, qwen 대기 상한(초), 첫프레임 홀드(초)
      SHORTS_COVER: ${{ vars.SHORTS_COVER || '1' }}
      # 정상 생성 ~86초(콜드 +44초). 300은 서버 행 때 런당 5분 낭비라 180으로 하향(2026-07-18).
      SHORTS_COVER_TIMEOUT: ${{ vars.SHORTS_COVER_TIMEOUT || '180' }}
      SHORTS_COVER_HOLD: ${{ vars.SHORTS_COVER_HOLD || '0.7' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # git diff(이전 커밋 대비)용

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      # 0) 캐시: npm(npx hyperframes) + 헤드리스 Chrome
      - name: 의존성 캐시(npm/puppeteer)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: hf-deps-${{ runner.os }}-hyperframes0.7.9
          restore-keys: hf-deps-${{ runner.os }}-

      # 0b) dedupe ledger 복원(런 간 영속 — main에 쓰지 않음 = 루프 방지)
      - name: ledger 복원
        uses: actions/cache@v4
        with:
          path: output/ledger.json
          key: ledger-${{ github.run_id }}
          restore-keys: ledger-

      # 1) 시스템 의존성: ffmpeg + 헤드리스 Chrome 시스템 라이브러리 + 폰트
      - name: 시스템 의존성 설치
        run: |
          set -e
          # 이미 있는 건 설치하지 않는다 — apt-get update 가 미러 상태에 따라
          # 수 분씩 걸리는 사고가 있었다(2026-08-06 asmr: 이 스텝에만 9분 28초).
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          # 헤드리스 Chrome 공유 라이브러리: 러너 이미지에 Chrome/Chromium 이
          # 사전 설치돼 있으면(현재 ubuntu-24.04 = Chrome 150) 이미 충족된 상태다.
          # 이미지가 바뀌어 Chrome 이 사라지면 아래 폴백이 자동으로 설치한다.
          if ! command -v google-chrome >/dev/null 2>&1 \
             && ! command -v chromium >/dev/null 2>&1 \
             && ! command -v chromium-browser >/dev/null 2>&1; then
            NEED="$NEED libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libxkbcommon0"
            NEED="$NEED libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64"
            NEED="$NEED libpango-1.0-0 libcairo2"
          fi
          if [ -n "$NEED" ]; then
            echo "apt 설치 대상:$NEED"
            sudo apt-get update
            sudo apt-get install -y $NEED
          else
            echo "시스템 의존성 이미 충족 — apt 스킵"
          fi
          python -m pip install -r pipeline/requirements.txt

      # 2) HyperFrames + 헤드리스 Chrome 준비(캐시는 M6에서 추가)
      - name: HyperFrames/Chrome 준비
        run: |
          npx --yes hyperframes@0.7.9 doctor || true
          npx --yes puppeteer browsers install chrome-headless-shell || true

      # 3) YouTube 자격증명 파일 생성(시크릿 → 파일)
      - name: YouTube 자격증명
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p pipeline/secrets
          if [ -n "$YT_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          fi
          if [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token.json
          fi

      # 4) 처리 대상 스토리보드 결정
      #    - dispatch + storyboard 입력 → 그 파일
      #    - 그 외(routine/* push, dispatch 빈입력) → output/news 의 storyboard 전부
      #      routine/<TOPIC> 브랜치는 main 리셋 + 오늘 파일 1개라 날짜 무관하게 처리해도 안전.
      #      (날짜 글롭은 루틴↔러너 KST 불일치로 0개 선택되는 버그가 있어 제거함. 중복은 ledger 가 스킵)
      - name: 처리 대상 스토리보드 결정
        id: pick
        run: |
          set -e
          SB="${{ github.event.inputs.storyboard }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$SB" ]; then
            echo "files=$SB" >> "$GITHUB_OUTPUT"
          else
            FILES=$(ls output/news/*_storyboard.json 2>/dev/null | tr '\n' ' ')
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
          fi
          echo "선정된 파일: '$(grep ^files= "$GITHUB_OUTPUT" | cut -d= -f2-)'"

      # 5) 파이프라인 실행 (영상화 → 업로드, privacy 준수)
      - name: 영상화 + 업로드
        run: |
          FILES="${{ steps.pick.outputs.files }}"
          if [ -z "$(echo $FILES | tr -d ' ')" ]; then
            echo "처리할 신규 스토리보드 없음 — 종료."
            exit 0
          fi
          cd pipeline
          # privacy: push(운영)는 JSON privacy 준수(★현재 전 토픽 public — 정치도 포함).
          #          강제 private 은 수동 테스트(workflow_dispatch)에서 force_private=true 일 때만.
          python run_pipeline.py $(for f in $FILES; do echo "../$f"; done) \
            --use-ledger --log ../output/run_log.json \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_private }}" = "true" ] && echo --force-private) \
            $([ "${{ github.event.inputs.no_upload }}" = "true" ] && echo --no-upload)

      # 산출물은 유튜브/IG/Threads 업로드(API) — GitHub 아티팩트는 쓰지 않는다(저장소 쿼터 회피).
      # 실행 로그는 Actions 콘솔에서 확인, ledger 는 위 actions/cache 로 런 간 보존.
