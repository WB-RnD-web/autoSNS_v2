name: Meow Remix 매일 쇼츠 — 기획(Claude API) → 그림·HD 영상(Spark) → 검수 → 유튜브 예약 공개

# 2026-11-09 사용자: HD 견본 3편(5초 컷 2개 · 720×1280·32fps)을 보고 "괜찮네 매일 쇼츠 PR 진행해줘".
# 하루 한 편(약 10초 · 음악만):
#   plan   : meow/plan_api.py 가 Claude API + 웹 검색으로 그날 편을 쓴다 → data/meow/<날짜>.json(고아 커밋 하나 · 강제).
#            꼴은 요일로 코드가 정한다(월·목 변신 · 화·토 밈 · 수·일 춤 · 금 게임) · 같은 날 두 번째 실행부터는 건너뛴다.
#   render : meow/daily.py — 1컷 그림(z-image) → 2컷 그림 = 1컷 그림 편집(qwen-image-edit · 같은 고양이) → 그림 검수(비전)
#            → HD 클립 2개(스파크 hd:true · 한 개 약 16분) → 영상 검수 → 조립(음악·자막) → 유튜브 비공개 + 예약 공개.
#            검수에 걸린 그림은 한 번 다시 그리고, 걸린 클립은 한 번 다시 만든다. 그래도 걸리면 그날은 올리지 않는다.
# 시각(KST): 00:40 본 실행 · 03:00 예비 · 08:10 마지막 예비. 공개는 그날 MEOW_SLOT_KST(기본 10:00 = 미국 동부 밤 8시).
#   ★05:45~08:00 KST(아침 업로드 루틴 몫)에는 Spark 를 쓰지 않는다(종료 코드 75 → 다음 예비가 잇는다).
#   받은 그림·클립은 Actions 캐시(meow-work-<stem>-)에 남아 다음 실행이 이어 받는다.
# ★두 번 올리지 않는다: 렌더 전에 유튜브 설명란 표식('Meow Remix · <날짜> <id>')을 보고, 올리기 직전에 한 번 더 본다.
# ★다른 채널에 올리지 않는다: post.py 가 토큰의 채널 핸들(@meowremixcats)을 확인한다.
# 끄기: 레포 변수 MEOW_DAILY=0. 시험: api-test/meow 에 올리면 그 브랜치 코드로 기획(data/meow-test)·렌더만 — 업로드 없음,
#   영상은 아티팩트. 수동 실행은 렌더만(upload 를 켜야 올린다).
# 비용: Claude API 크레딧(기획 약 0.5달러·검수 몇 센트 — <날짜>_api.json·qa.json) · Spark(공용) · 퍼블릭 레포 Actions. 결제 수단 없음.

on:
  schedule:
    - cron: "40 15 * * *"       # 00:40 KST 본 실행
    - cron: "0 18 * * *"        # 03:00 KST 예비
    - cron: "10 23 * * *"       # 08:10 KST 마지막 예비(공개 10:00 전)
  workflow_dispatch:
    inputs:
      day:
        description: "기획 날짜 YYYY-MM-DD(KST · 비우면 오늘)"
        default: ""
      upload:
        description: "유튜브에 올리기(끄면 렌더만 — 영상은 아티팩트)"
        type: boolean
        default: false
  push:
    branches:
      - "api-test/meow"

permissions:
  contents: read

concurrency:
  group: meow-daily
  cancel-in-progress: false

jobs:
  plan:
    if: (vars.MEOW_DAILY || '1') != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write          # data/meow(시험: data/meow-test) 하나에만 쓴다
    outputs:
      day: ${{ steps.prep.outputs.day }}
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      DATA_BRANCH: ${{ github.event_name == 'push' && 'data/meow-test' || 'data/meow' }}
      MEOW_PLAN_MODEL: ${{ vars.MEOW_PLAN_MODEL || 'claude-opus-5-5' }}
      MEOW_PLAN_EFFORT: ${{ vars.MEOW_PLAN_EFFORT || 'high' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: python -m pip install -q anthropic

      - name: 오늘·기획 받기
        id: prep
        run: |
          set -euo pipefail
          DAY="${{ github.event.inputs.day }}"
          [ -n "$DAY" ] || DAY=$(date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          W="$RUNNER_TEMP/plan"
          mkdir -p "$W"
          if git fetch -q --no-tags --depth=1 origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"; then
            git archive "origin/$DATA_BRANCH" | tar -x -C "$W"
          fi
          if [ -f "$W/$DAY.json" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::$DAY 기획은 이미 있다 — 건너뛴다"
          fi

      - name: 기획(Claude API + 웹 검색)
        if: steps.prep.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::시크릿 ANTHROPIC_API_KEY 없음"; exit 1; fi
          python meow/plan_api.py write --day "${{ steps.prep.outputs.day }}" --dir "$RUNNER_TEMP/plan"

      - name: data/meow 에 올리기(고아 커밋 하나 · 강제)
        if: steps.prep.outputs.skip != '1'
        run: |
          set -euo pipefail
          DAY="${{ steps.prep.outputs.day }}"
          W="$RUNNER_TEMP/plan"
          {
            echo "# $DATA_BRANCH — 자동 생성(손대지 않는다)"
            echo
            echo "- 만든 곳: .github/workflows/meow-daily.yml · meow/plan_api.py — Meow Remix 매일 한 편 기획"
            echo "- <날짜>.json = render.py·post.py 가 읽는 기획(편 하나 · 5초 컷 2개 · 2컷째는 1컷 그림 편집) 또는 skip"
            echo "- <날짜>_api.json = 모델·꼴·시도·토큰·검색·달러"
            echo "- 마지막 생성: $(date '+%F %H:%M') KST · run ${GITHUB_RUN_ID}"
          } > "$W/README.md"
          export GIT_INDEX_FILE="$RUNNER_TEMP/plan.index"
          export GIT_AUTHOR_NAME="meow-daily" GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          REPO="$GITHUB_WORKSPACE/.git"
          ( cd "$W" && git --git-dir="$REPO" --work-tree=. add -A -f . )
          TREE=$(git --git-dir="$REPO" write-tree)
          COMMIT=$(git --git-dir="$REPO" commit-tree "$TREE" -m "data: Meow Remix 기획 $DAY")
          git --git-dir="$REPO" push -f origin "$COMMIT:refs/heads/$DATA_BRANCH"
          { echo '```json'; cat "$W/${DAY}_api.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true

  render:
    needs: plan
    runs-on: ubuntu-latest
    # 그림 3장(편집 약 2.5분) + HD 클립 2개(약 16분씩 · GPU 기다림 최대 약 1시간) + 검수에 걸리면 다시 만들기
    timeout-minutes: 300
    permissions:
      contents: read
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      DATA_BRANCH: ${{ github.event_name == 'push' && 'data/meow-test' || 'data/meow' }}
      DAY: ${{ needs.plan.outputs.day }}
      MEOW_SLOT_KST: ${{ vars.MEOW_SLOT_KST || '10:00' }}
      MEOW_QA_MODEL: ${{ vars.MEOW_QA_MODEL || 'claude-opus-5-5' }}
      UPLOAD: ${{ github.event_name == 'schedule' || github.event.inputs.upload == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: 기획 받기(읽기 전용)
        id: pick
        run: |
          set -euo pipefail
          mkdir -p output/meow_plan
          git fetch -q --no-tags --depth=1 origin "$DATA_BRANCH" && git archive FETCH_HEAD | tar -x -C output/meow_plan \
            || echo "($DATA_BRANCH 없음)"
          F="output/meow_plan/$DAY.json"
          if [ ! -f "$F" ]; then echo "::warning::$DAY 기획 없음"; exit 0; fi
          STEM=$(python -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); cs=d.get('concepts') or []; print(cs[0]['id']+'_'+cs[0]['slug'] if cs else '')" "$F")
          if [ -z "$STEM" ]; then
            echo "::notice::$DAY 은 건너뛴다: $(python -c "import json,sys; print(json.load(open(sys.argv[1],encoding='utf-8')).get('skip',''))" "$F")"
            exit 0
          fi
          echo "doc=$F" >> "$GITHUB_OUTPUT"
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          echo "대상: $DAY $STEM"

      - name: 시스템 의존성
        if: steps.pick.outputs.doc != ''
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r pipeline/requirements.txt fonttools brotli

      - name: 테스트(오프라인) · 기획 검사
        if: steps.pick.outputs.doc != ''
        run: |
          python meow/test_meow.py
          python meow/render.py check "${{ steps.pick.outputs.doc }}"

      - name: YouTube 자격증명(Meow Remix 채널 — 옛 Nine Tails 토큰)
        id: cred
        if: steps.pick.outputs.doc != '' && env.UPLOAD == 'true'
        env:
          YT_TOKEN_JSON_GUMIHO: ${{ secrets.YT_TOKEN_JSON_GUMIHO }}
        run: |
          mkdir -p pipeline/secrets
          if [ -z "$YT_TOKEN_JSON_GUMIHO" ]; then echo "::error::시크릿 YT_TOKEN_JSON_GUMIHO 없음"; exit 1; fi
          printf '%s' "$YT_TOKEN_JSON_GUMIHO" > pipeline/secrets/token_gumiho.json

      - name: 유튜브에 이미 있나(렌더 전에)
        id: seen
        if: steps.cred.outcome == 'success'
        env:
          YT_TOKEN_NOVEL: pipeline/secrets/token_gumiho.json
        run: |
          set +e
          python meow/post.py seen "${{ steps.pick.outputs.doc }}"
          rc=$?
          if [ $rc -eq 0 ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ $rc -eq 10 ] && exit 0
          exit $rc            # 다른 채널 토큰·API 오류 — 렌더(스파크 30분)도 하지 않는다

      - name: 받아 둔 그림·클립 복원(이어 받기)
        if: steps.pick.outputs.doc != '' && steps.seen.outputs.skip != '1'
        uses: actions/cache/restore@v4
        with:
          path: output/meow/.work/${{ steps.pick.outputs.stem }}
          key: meow-work-${{ steps.pick.outputs.stem }}-${{ github.run_id }}
          restore-keys: meow-work-${{ steps.pick.outputs.stem }}-

      # 75 = 05:45~08:00 KST 라 Spark 를 멈췄다(다음 예비가 잇는다) · 3 = 검수에 두 번 걸려 오늘은 안 올린다 — 둘 다 실패가 아니다
      - name: 렌더(그림 → 검수 → HD 클립 → 검수 → 조립)
        id: render
        if: steps.pick.outputs.doc != '' && steps.seen.outputs.skip != '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python meow/daily.py render "${{ steps.pick.outputs.doc }}"
          rc=$?
          if [ $rc -eq 75 ]; then echo "quiet=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ $rc -eq 3 ]; then echo "blocked=1" >> "$GITHUB_OUTPUT"; echo "::warning::검수에 두 번 걸려 오늘은 올리지 않는다"; exit 0; fi
          exit $rc

      - name: 유튜브(비공개 + 예약 공개)
        if: >-
          steps.cred.outcome == 'success' && steps.seen.outputs.skip != '1' && steps.render.outcome == 'success'
          && steps.render.outputs.quiet != '1' && steps.render.outputs.blocked != '1'
        env:
          YT_TOKEN_NOVEL: pipeline/secrets/token_gumiho.json
        run: python meow/post.py youtube "${{ steps.pick.outputs.doc }}" --slot-kst "$MEOW_SLOT_KST"

      - name: 받은 그림·클립 저장(중간에 멈춰도 다음 실행이 잇게)
        if: always() && steps.pick.outputs.stem != '' && hashFiles(format('output/meow/.work/{0}/*.png', steps.pick.outputs.stem)) != ''
        uses: actions/cache/save@v4
        with:
          path: output/meow/.work/${{ steps.pick.outputs.stem }}
          key: meow-work-${{ steps.pick.outputs.stem }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 요약(검수·기획 비용)
        if: always() && steps.pick.outputs.stem != ''
        run: |
          Q="output/meow/.work/${{ steps.pick.outputs.stem }}/qa.json"
          { echo "### ${{ steps.pick.outputs.stem }}"; echo '```json'; cat "$Q" 2>/dev/null || echo "{}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과물(영상·표지·1초 시트·그림·검수)
        if: always() && steps.pick.outputs.stem != ''
        uses: actions/upload-artifact@v4
        with:
          name: meow-${{ steps.pick.outputs.stem }}-${{ github.run_number }}
          path: |
            output/meow/*.mp4
            output/meow/*_cover.jpg
            output/meow/*_sheet.jpg
            output/meow/*_meta.json
            output/meow/.work/${{ steps.pick.outputs.stem }}/*.png
            output/meow/.work/${{ steps.pick.outputs.stem }}/*.jpg
            output/meow/.work/${{ steps.pick.outputs.stem }}/qa.json
            output/meow_plan/${{ env.DAY }}*.json
          retention-days: 7
          if-no-files-found: warn

      - if: always()
        run: rm -rf pipeline/secrets
