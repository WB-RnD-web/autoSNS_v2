name: 영어 제목 소급(1회성 · ASMR + 라디오·소설)

# 이미 올라간 ASMR 롱폼에 영어 제목·설명(현지화)을 붙인다 — pipeline/asmr_i18n_backfill.py.
# 기본은 미리보기(바꾸지 않음). apply 를 켜야 실제로 유튜브 영상 메타데이터를 수정한다.
# 제목·설명 원문은 그대로 두고 'en' 번역만 추가한다. 이미 en 이 있는 영상은 건너뛴다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제 적용(끄면 미리보기만)"
        type: boolean
        default: false
      translate:
        description: "ASMR 가 아닌 롱폼(라디오·소설)도 Spark gemma 로 번역해 채우기"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60              # 번역 포함 시 40편 × 1~2분 ÷ 동시 4
    env:
      I18N_LOCALIZE: "1"
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt
      - name: YouTube 자격증명(ASMR 채널 토큰)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON_FORCESSL: ${{ secrets.YT_TOKEN_JSON_FORCESSL }}
        run: |
          mkdir -p pipeline/secrets
          printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
          # 현지화(영어 제목)용 예비 토큰 — SCP 가 이 토큰으로 영어 제목을 붙여 왔다
          if [ -n "$YT_TOKEN_JSON_FORCESSL" ]; then
            printf '%s' "$YT_TOKEN_JSON_FORCESSL" > pipeline/secrets/token_forcessl.json
          fi
      - name: 소급
        run: |
          cd pipeline
          python asmr_i18n_backfill.py             $([ "${{ github.event.inputs.apply }}" = "true" ] && echo --apply)             $([ "${{ github.event.inputs.translate }}" = "true" ] && echo --translate --min-min 4)
