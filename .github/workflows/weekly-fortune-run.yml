name: 주간 띠별 운세 풀이 — 대본 검사 → 목소리·화면 → 롱폼 업로드

# 호출: weekly-fortune.yml(routine/weekly_fortune push · 수동 실행)이 @main 으로 부른다.
#   코드는 항상 main, 데이터(대본)는 이 push 에서 ★새로 추가된 output/weekly_fortune/<월요일>_weekly_fortune.json 만.
#   같은 주 파일을 고쳐 다시 밀어도(추가가 아니라 수정) 다시 올리지 않는다 — 주 단위 멱등의 첫 겹.
#   둘째 겹은 ledger(weeklyfortune-ledger- 캐시), 셋째 겹은 유튜브 설명란 끝 줄 '주간 띠별 운세 <주>' 표식이다.
#
# 대본은 pipeline/weekly_fortune.py 가 먼저 검사한다(주·12띠 순서·칸마다 글자 수·금지어·반복·예상 길이 8~12분).
#   못 넘으면 렌더도 업로드도 없이 빨간불. 규칙은 코드에만 있다 — 루틴 프롬프트의 부탁은 자주 무시된다.
# 업로드: 카테고리 24 · 기본 언어 ko · 오디오 언어 ko · 아동용 아님 · 합성 표시 안 함(그림체 운세 — 쇼츠와 같은 관례)
#   · 재생목록 '주간 띠별 운세'(없으면 만든다) · 일 20:00 KST 예약 공개(이미 지났으면 바로 공개).
#
# ⚠️ 루프 가드: permissions read — 레포에 아무것도 커밋하지 않는다(산출물은 유튜브·아티팩트로만).

on:
  workflow_call:
    inputs:
      script:
        description: "대본 경로(비우면 이 push 에서 새로 추가된 주간 대본)"
        type: string
        default: ""
      no_upload:
        type: boolean
        default: false
      force_private:
        type: boolean
        default: false
      manual:
        description: "수동 실행(느슨 검사 · 아티팩트 보관)"
        type: boolean
        default: false

# 같은 채널·같은 Spark — 겹쳐 돌지 않게. 다른 워크플로와 그룹을 나눠 서로 대기열을 취소하지 않는다.
concurrency:
  group: weekly-fortune
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # 목소리 ~90조각을 한 건씩(8~15분) + 화면·인코딩 ~3분 + 업로드. Spark 대기열이 길면 늘어난다.
    timeout-minutes: 75
    env:
      TZ: Asia/Seoul
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      WEEKLY_VOICE: ${{ vars.WEEKLY_VOICE || 'F2' }}
      WEEKLY_TEMPO: ${{ vars.WEEKLY_TEMPO || '0.92' }}
      WEEKLY_TTS_WORKERS: "1"                     # ★공용 Spark — 한 건씩
      WEEKLY_PUBLISH_HHMM: ${{ vars.WEEKLY_PUBLISH_HHMM || '20:00' }}
      WEEKLY_PLAYLIST: ${{ vars.WEEKLY_PLAYLIST || '주간 띠별 운세' }}
      # 한국 시니어 대상 — 영어 제목·자막 번역은 붙이지 않는다
      I18N_LOCALIZE: "0"
      I18N_CAPTIONS: "0"
    steps:
      # 1) 코드는 main 에서 — workflow_call 이면 github.ref 가 호출한 브랜치(routine/weekly_fortune)라 ref 를 꼭 적는다.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # 이번 push 에서 '추가된' 파일을 가리려면 역사가 필요하다

      # 2) 데이터: 누적 브랜치(반복 검사 이력) + 이번 push 에서 새로 추가된 대본만
      - name: 처리할 주간 대본 고르기
        id: pick
        run: |
          set -euo pipefail
          B=routine/weekly_fortune
          git fetch -q --no-tags origin "+refs/heads/$B:refs/remotes/origin/$B" 2>/dev/null || echo "($B 아직 없음)"
          FILES=""
          S="${{ inputs.script }}"
          if [ -n "$S" ]; then
            if [ ! -f "$S" ] && git cat-file -e "origin/$B:$S" 2>/dev/null; then
              mkdir -p "$(dirname "$S")"; git show "origin/$B:$S" > "$S"
            fi
            [ -f "$S" ] || { echo "::error::대본 없음: $S"; exit 1; }
            FILES="$S"
          elif [ "${{ github.event_name }}" = "push" ]; then
            SHA="${{ github.sha }}"
            BEFORE="${{ github.event.before }}"
            git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$SHA"
            if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BASE=$(git merge-base origin/main "$SHA")      # 브랜치를 새로 만든 push
            else
              BASE="$BEFORE"
            fi
            for f in $(git diff --name-only --diff-filter=A "$BASE" "$SHA" -- output/weekly_fortune/ \
                       | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}_weekly_fortune\.json$' || true); do
              mkdir -p "$(dirname "$f")"; git show "$SHA:$f" > "$f"
              FILES="$FILES $f"
            done
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "선정된 파일: '$FILES'"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: 시스템 의존성 설치
        run: |
          set -e
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if [ -n "$NEED" ]; then sudo apt-get update && sudo apt-get install -y $NEED; fi
          python -m pip install -r pipeline/requirements.txt

      - name: 주간 운세 테스트(깨진 코드로는 올리지 않는다)
        run: python3 pipeline/test_weekly_fortune.py

      # ledger — ★다른 워크플로의 접두(ledger-·ailedger-·korea-ledger-·drama-ledger-)와 겹치면 안 된다
      #   (restore-keys 는 접두 매칭이라 서로의 ledger 를 집어 온다)
      - name: ledger 복원(주간 운세 전용)
        if: steps.pick.outputs.files != ''
        uses: actions/cache/restore@v4
        with:
          path: output/weekly_fortune_ledger.json
          key: weeklyfortune-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weeklyfortune-ledger-

      - name: YouTube 자격증명(같은 채널 확장 스코프 토큰)
        if: steps.pick.outputs.files != ''
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p pipeline/secrets
          [ -n "$YT_CLIENT_SECRET_JSON" ] && printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
          elif [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token_novel.json
            echo "⚠️ YT_TOKEN_JSON_NOVEL 없음 — 업로드는 되지만 재생목록은 스킵될 수 있다"
          else
            echo "⚠️ 업로드 토큰 없음 — 렌더만 진행"
          fi

      - name: 검사 → 렌더 → 업로드
        if: steps.pick.outputs.files != ''
        run: |
          FILES="${{ steps.pick.outputs.files }}"
          cd pipeline
          EXTRA=""
          # 수동 실행: 느슨 검사(주·파일 이름을 경고로 — ★비공개/업로드 없음일 때만 먹힌다)
          if [ "${{ inputs.manual }}" = "true" ]; then EXTRA="--lenient"; fi
          if [ "${{ inputs.force_private }}" = "true" ]; then EXTRA="$EXTRA --force-private"; fi
          if [ "${{ inputs.no_upload }}" = "true" ]; then EXTRA="$EXTRA --no-upload"; fi
          python run_weekly_fortune.py $(for f in $FILES; do echo "../$f"; done) \
            --ledger-path ../output/weekly_fortune_ledger.json --log ../output/weekly_fortune_log.json $EXTRA

      - name: 새로 추가된 주간 대본 없음
        if: steps.pick.outputs.files == ''
        run: |
          echo "이번 push 에 새로 추가된 주간 대본이 없다 — 정상이다."
          echo "(같은 주 파일을 고쳐 다시 민 경우 여기로 온다. 같은 주는 다시 올리지 않는다)"

      # 올라간 건 올라간 거다 — 잡이 실패해도 ledger 는 남긴다(재실행 때 두 번 올리지 않게)
      - name: ledger 저장
        if: always() && hashFiles('output/weekly_fortune_ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/weekly_fortune_ledger.json
          key: weeklyfortune-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 검증 산출물(수동 실행만) — 영상·썸네일·순위표
        if: always() && inputs.manual
        uses: actions/upload-artifact@v4
        with:
          name: weekly-fortune-${{ github.run_number }}
          path: |
            output/renders/*_weekly_fortune.mp4
            output/renders/*_weekly_fortune_thumb.jpg
            output/renders/*_weekly_fortune_table.png
            output/weekly_fortune_log.json
          retention-days: 3
          if-no-files-found: warn
