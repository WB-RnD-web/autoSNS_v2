name: 인스타 오늘의 골라보기 — 대본 검사 → 그림·목소리(Spark) → 릴스 렌더 → 게시

# 인스타 계정 '오늘의 골라보기'(@zerocrew.studio) — 보는 사람이 멈춰서 고르는 20초 릴스, 하루 한 편.
# 꼴은 코드가 날짜로 정한다(insta/pick_plan.py: 그림 고르기 → 상식 퀴즈 → 타로 카드 → 밸런스 게임 → 태어난 달 표).
# 트리거: 로컬 예약 작업(insta-pick-daily)이 routine/insta_pick 에 output/insta_pick/<날짜>_<kind>_<slug>.json 을 push.
#   ★코드는 늘 main 에서, 대본은 routine/insta_pick 에서 '오늘 날짜' 파일 하나만(pick_plan.py targets).
#   ★대본을 믿지 않고 다시 검사한다(pick_reel.py check) · 하루 한 편(게시 ledger) · 꼴이 날짜와 다르면 올리지 않는다.
# 게시: push 로 온 오늘 대본은 올린다(사용자 10/8 "매일 올려줘"). 막기 = 레포 변수 INSTA_PICK_PUBLISH=0.
# ★돈 드는 호출 없음: Spark(그림·목소리) · Cloudinary 무료 · 퍼블릭 레포 Actions. 유튜브 홍보·링크 없음.

on:
  push:
    branches:
      - "routine/insta_pick"
    paths:
      - "output/insta_pick/**"
  workflow_dispatch:
    inputs:
      script:
        description: "대본 경로(렌더만 — 게시하지 않는다)"
        default: "insta/samples/pick_door.json"
      mock:
        description: "Spark·네트워크 없이(가짜 목소리·그림)"
        type: boolean
        default: false

concurrency:
  group: insta-pick
  cancel-in-progress: false

permissions:
  contents: read          # 레포에 아무것도 쓰지 않는다(루프 방지)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      PYTHONIOENCODING: utf-8
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GUMIHO_SPARK_MAX_WAITING: "6"
      INSTA_VOICE: ${{ vars.INSTA_VOICE || 'F1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: routine/insta_pick 대본 가져오기(데이터만)
        if: github.event_name == 'push'
        run: |
          git fetch --depth=1 origin routine/insta_pick && git checkout FETCH_HEAD -- output/insta_pick/ \
            || echo "(routine/insta_pick 에 output/insta_pick 없음)"
          ls output/insta_pick/ 2>/dev/null | tail -5 || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: 시스템 의존성
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install -r pipeline/requirements.txt numpy fonttools brotli

      - name: 테스트(오프라인)
        run: python insta/test_pick.py

      - name: 처리 대상
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            T="${{ github.event.inputs.script }}"
          else
            T=$(python insta/pick_plan.py targets)
          fi
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          echo "대상: '$T'"

      - name: 대본 검사(못 넘으면 여기서 멈춘다)
        if: steps.pick.outputs.targets != ''
        run: python insta/pick_reel.py check ${{ steps.pick.outputs.targets }}

      - name: 게시 ledger 캐시(하루 한 편)
        uses: actions/cache@v4
        with:
          path: output/insta_pick_render/posted.json
          key: insta-pick-ledger-${{ github.run_id }}
          restore-keys: insta-pick-ledger-

      - name: 렌더
        if: steps.pick.outputs.targets != ''
        run: python insta/pick_reel.py render ${{ steps.pick.outputs.targets }} $([ "${{ github.event.inputs.mock }}" = "true" ] && echo --mock)

      - name: 게시(push 로 온 오늘 대본만 · INSTA_PICK_PUBLISH=0 이면 dry-run)
        if: steps.pick.outputs.targets != '' && github.event_name == 'push'
        env:
          INSTA_PICK_PUBLISH: ${{ vars.INSTA_PICK_PUBLISH || '1' }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python insta/pick_plan.py post ${{ steps.pick.outputs.targets }}

      - name: 결과물(커버·한눈에 보기·메타·영상)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insta-pick-${{ github.run_number }}
          path: |
            output/insta_pick_render/*_cover.jpg
            output/insta_pick_render/*_sheet.jpg
            output/insta_pick_render/*_meta.json
            output/insta_pick_render/*.mp4
          retention-days: 5
          if-no-files-found: warn
