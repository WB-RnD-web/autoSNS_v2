name: AI 소식 쇼츠 — 대본 검사 → 렌더 → 유튜브(+인스타·쓰레드)

# 호출: ai-news.yml(routine/ai_am·ai_pm push)이 @main 으로 부른다. 수동 실행도 된다(기본: 견본 · 비공개 · 업로드 없음).
#   코드는 항상 main, 데이터(대본)는 이 push 에서 ★새로 추가된 output/news/<DATE>_ai_<am|pm>_storyboard.json 만.
#   같은 슬롯 파일을 고쳐 다시 밀어도(추가가 아니라 수정) 다시 올리지 않는다 — 슬롯 멱등의 첫 겹.
#   둘째 겹은 ledger(ailedger- 캐시), 셋째 겹은 유튜브 설명란의 'AI 소식 <날짜> <오전|저녁>' 표식이다.
#
# 대본은 pipeline/ai_news.py 가 먼저 검사한다(출처·48시간·14일 중복·숫자·용어·캡션·형식 돌려쓰기).
#   못 넘으면 렌더도 업로드도 없이 빨간불. 규칙은 코드에만 있다 — 루틴 프롬프트의 부탁은 자주 무시된다.
#
# ⚠️ 루프 가드: permissions read — 레포에 아무것도 커밋하지 않는다(산출물은 유튜브·인스타로만).

on:
  workflow_call:
    inputs:
      storyboard:
        description: "대본 경로(비우면 이 push 에서 새로 추가된 AI 대본)"
        type: string
        default: ""
      force_private:
        description: "privacy 강제 private (+ 인스타·쓰레드 안 올림)"
        type: boolean
        default: false
      no_upload:
        description: "업로드 없이 렌더만(검증)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      storyboard:
        description: "대본 경로 — 레포 파일(docs/samples/…) 또는 AI 브랜치의 output/news/<DATE>_ai_<am|pm>_storyboard.json"
        default: "docs/samples/2026-01-01_ai_am_storyboard.json"
      force_private:
        description: "privacy 강제 private (+ 인스타·쓰레드 안 올림)"
        type: boolean
        default: true
      no_upload:
        description: "업로드 없이 렌더만(검증) — 렌더 결과는 아티팩트로 2일 보관"
        type: boolean
        default: true

# 쇼츠(shorts-v2)와 다른 그룹 — 같은 그룹에 대기가 둘 쌓이면 먼저 대기하던 쪽이 취소된다(정치가 밀려나면 안 된다).
concurrency:
  group: ai-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TZ: Asia/Seoul
      DEFAULT_PRIVACY: ${{ vars.DEFAULT_PRIVACY || 'private' }}
      # ANTHROPIC_API_KEY 는 넘기지 않는다 — 장면은 루틴이 쓰고 번역도 끄므로 유료 폴백이 필요 없다.
      I18N_LOCALIZE: ${{ vars.SHORTS_I18N || '0' }}
      I18N_CAPTIONS: "0"
      I18N_LANGS: ${{ vars.I18N_LANGS || 'en,ja,zh-Hant' }}
      # 인스타(@zerocrew.studio)·쓰레드: AI 소식만 보낸다. ★실제 게시는 INSTA_PUBLISH=1 일 때만(아니면 dry-run),
      #   쓰레드는 INSTA_THREADS=1 일 때만 — insta.yml 과 같은 스위치다.
      SOCIAL_CROSSPOST_TOPICS: ${{ vars.SOCIAL_CROSSPOST_TOPICS || 'ai' }}
      INSTA_PUBLISH: ${{ vars.INSTA_PUBLISH || '0' }}
      INSTA_THREADS: ${{ vars.INSTA_THREADS || '0' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      WBSPARK_BASE: ${{ vars.WBSPARK_BASE || 'https://wangbyul.com/wbSpark' }}
      WBSPARK_TOKEN: ${{ secrets.WBSPARK_TOKEN }}
      SHORTS_COVER: ${{ vars.SHORTS_COVER || '1' }}
      SHORTS_COVER_TIMEOUT: ${{ vars.SHORTS_COVER_TIMEOUT || '240' }}
      SHORTS_COVER_HOLD: ${{ vars.SHORTS_COVER_HOLD || '0.7' }}
      SHORTS_BG: ${{ vars.SHORTS_BG || '1' }}
      SHORTS_BG_TIMEOUT: ${{ vars.SHORTS_BG_TIMEOUT || '240' }}
      # ★AI 진행자·아바타 없음(정책). 코드(motion_short.PRESENTER_NEVER)도 막지만 여기서도 고정으로 끈다.
      PRESENTER: "0"
      VO_BACKEND: ${{ vars.VO_BACKEND || 'wbspark' }}
      VO_PRESET_BYEOLHA: ${{ vars.VO_PRESET_BYEOLHA || 'F1' }}
      # 멈추기: 레포 변수 SHORTS_PAUSED_TOPICS 에 ai 를 넣는다(예: horoscope,zodiac,stock,stock_us,ai)
      SHORTS_PAUSED_TOPICS: ${{ vars.SHORTS_PAUSED_TOPICS || '' }}
    steps:
      # 1) 코드는 main 에서 — workflow_call 이면 github.ref 가 호출한 브랜치(routine/ai_*)라 ref 를 꼭 적는다.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0          # 이번 push 에서 '추가된' 파일을 가리려면 역사가 필요하다

      - name: AI 소식 검사 테스트(깨진 코드로는 올리지 않는다)
        run: python3 pipeline/test_ai_news.py

      # 2) 데이터: AI 누적 브랜치 둘 다(중복 검사 이력) + 이번 push 에서 새로 추가된 대본만
      - name: 처리할 AI 대본 고르기
        id: pick
        run: |
          set -euo pipefail
          mkdir -p output/news
          for b in routine/ai_am routine/ai_pm; do
            git fetch -q --no-tags origin "+refs/heads/$b:refs/remotes/origin/$b" 2>/dev/null \
              || echo "($b 아직 없음)"
          done
          FILES=""
          SB="${{ inputs.storyboard }}"
          if [ -n "$SB" ]; then
            if [ ! -f "$SB" ]; then
              for b in routine/ai_am routine/ai_pm; do
                if git cat-file -e "origin/$b:$SB" 2>/dev/null; then
                  mkdir -p "$(dirname "$SB")"; git show "origin/$b:$SB" > "$SB"; break
                fi
              done
            fi
            [ -f "$SB" ] || { echo "::error::대본 없음: $SB"; exit 1; }
            FILES="$SB"
          elif [ "${{ github.event_name }}" = "push" ]; then
            SHA="${{ github.sha }}"
            BEFORE="${{ github.event.before }}"
            git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch -q --no-tags origin "$SHA"
            if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BASE=$(git merge-base origin/main "$SHA")      # 브랜치를 새로 만든 push
            else
              BASE="$BEFORE"
            fi
            for f in $(git diff --name-only --diff-filter=A "$BASE" "$SHA" -- output/news/ \
                       | grep -E '/[0-9]{4}-[0-9]{2}-[0-9]{2}_ai_(am|pm)_storyboard\.json$' || true); do
              git show "$SHA:$f" > "$f"
              FILES="$FILES $f"
            done
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "선정된 파일: '$FILES'"

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.files != ''
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.files != ''
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      - name: 의존성 캐시(npm/puppeteer)
        if: steps.pick.outputs.files != ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: hf-deps-${{ runner.os }}-hyperframes0.7.9
          restore-keys: hf-deps-${{ runner.os }}-

      # ledger — ★쇼츠의 'ledger-' 와 접두가 겹치면 안 된다(restore-keys 는 접두 매칭이라 서로의 ledger 를 집어 온다)
      - name: ledger 복원(AI 전용)
        if: steps.pick.outputs.files != ''
        uses: actions/cache/restore@v4
        with:
          path: output/ai_ledger.json
          key: ailedger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ailedger-

      - name: 시스템 의존성 설치
        if: steps.pick.outputs.files != ''
        run: |
          set -e
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if ! command -v google-chrome >/dev/null 2>&1 \
             && ! command -v chromium >/dev/null 2>&1 \
             && ! command -v chromium-browser >/dev/null 2>&1; then
            NEED="$NEED libnss3 libatk-bridge2.0-0 libatk1.0-0 libcups2 libdrm2 libxkbcommon0"
            NEED="$NEED libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64"
            NEED="$NEED libpango-1.0-0 libcairo2"
          fi
          if [ -n "$NEED" ]; then
            sudo apt-get update
            sudo apt-get install -y $NEED
          fi
          python -m pip install -r pipeline/requirements.txt

      - name: HyperFrames/Chrome 준비
        if: steps.pick.outputs.files != ''
        run: |
          npx --yes hyperframes@0.7.9 doctor || true
          npx --yes puppeteer browsers install chrome-headless-shell || true

      # 업로드는 쇼츠 토큰(token.json), 재생목록·유튜브 이중 확인은 같은 채널의 소설 토큰(youtube 스코프).
      #   둘 다 같은 OAuth 클라이언트 = 같은 Cloud 프로젝트 쿼터를 쓴다(PR 설명의 쿼터 계산 참고).
      - name: YouTube 자격증명
        if: steps.pick.outputs.files != ''
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
        run: |
          mkdir -p pipeline/secrets
          [ -n "$YT_CLIENT_SECRET_JSON" ] && printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          [ -n "$YT_TOKEN_JSON" ] && printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token.json
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
          else
            echo "⚠️ YT_TOKEN_JSON_NOVEL 없음 — 재생목록·유튜브 이중 확인은 스킵(업로드는 정상)"
          fi

      - name: 검사 → 렌더 → 업로드
        if: steps.pick.outputs.files != ''
        run: |
          FILES="${{ steps.pick.outputs.files }}"
          cd pipeline
          EXTRA=""
          # 수동 실행: 일시정지 무시 + 느슨 검사(날짜·신선도·중복을 경고로 — ★비공개/업로드 없음일 때만 먹힌다)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EXTRA="--include-paused --ai-lenient"; fi
          # ★비공개 테스트면 인스타·쓰레드도 막는다(유튜브만 비공개가 되고 인스타엔 공개로 올라가던 사고 방지)
          if [ "${{ inputs.force_private }}" = "true" ]; then EXTRA="$EXTRA --force-private --no-social"; fi
          if [ "${{ inputs.no_upload }}" = "true" ]; then EXTRA="$EXTRA --no-upload"; fi
          python run_pipeline.py $(for f in $FILES; do echo "../$f"; done) \
            --use-ledger --ledger-path ../output/ai_ledger.json --log ../output/ai_run_log.json $EXTRA

      - name: 새로 추가된 AI 대본 없음
        if: steps.pick.outputs.files == ''
        run: |
          echo "이번 push 에 새로 추가된 AI 대본이 없다 — 정상이다."
          echo "(같은 슬롯 파일을 고쳐 다시 민 경우 여기로 온다. 같은 슬롯은 다시 올리지 않는다)"

      # 올라간 건 올라간 거다 — 잡이 실패해도 ledger 는 남긴다(재실행 때 두 번 올리지 않게)
      - name: ledger 저장
        if: always() && hashFiles('output/ai_ledger.json') != ''
        uses: actions/cache/save@v4
        with:
          path: output/ai_ledger.json
          key: ailedger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 렌더 결과 보관 (수동 실행만)
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ai-renders-${{ github.run_number }}
          path: output/renders/*.mp4
          retention-days: 2
          if-no-files-found: ignore
