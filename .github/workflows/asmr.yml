name: ASMR(백색소음) 테마 스펙 → 정적배경 + Freesound 1시간 → 유튜브(+재생목록)

# 트리거: 루틴이 새 테마 스펙을 routine/asmr(★영구 누적 브랜치)에 push 하면 실행.
#   처리 대상 = 이 push 에서 ★새로 추가된 output/asmr/<DATE>_<theme>.json (git diff).
#
# ⚠️ 루프 가드(소설과 동일): permissions read — 레포에 산출물 커밋 안 함(유튜브로만).
#   상태 파일(asmr/state.json)은 '루틴'이 쓰는 것. 브랜치 리셋 금지(누적 보존).

on:
  push:
    branches:
      - "routine/asmr"
    paths:
      - "output/asmr/**"
  workflow_dispatch:
    inputs:
      spec:
        description: "처리할 스펙 JSON 경로(비우면 신규/전체 자동 탐색)"
        default: ""
      force_private:
        description: "privacy 강제 private (수동 테스트 옵트인)"
        type: boolean
        default: false
      no_upload:
        description: "업로드 없이 렌더만(검증)"
        type: boolean
        default: false

concurrency:
  group: asmr-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # 실측 최대 29분, 인코딩 최적화 후 단축 예상
    env:
      TZ: Asia/Seoul
      # ★다국어: 제목·설명 현지화만(50 units). 자막 트랙은 안 건다(낭독이 거의 없음).
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-4-6' }}
      I18N_LOCALIZE: ${{ vars.I18N_LOCALIZE || '1' }}
      I18N_CAPTIONS: "0"
      I18N_LANGS: ${{ vars.I18N_LANGS || 'en,ja,zh-Hant' }}
      # 배경/썸네일 이미지(FLUX klein-4b, 소설과 동일 엔드포인트)
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # ASMR 소스 음원(Freesound, CC0)
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      # 나레이션 보이스(여/남) · 믹스 게인 · 소스 수집 길이(초) — 필요 시 vars 로 조정
      ASMR_VOICE_FEMALE: ${{ vars.ASMR_VOICE_FEMALE || 'ko-KR-SunHiNeural' }}
      ASMR_VOICE_MALE: ${{ vars.ASMR_VOICE_MALE || 'ko-KR-InJoonNeural' }}
      ASMR_NARRATION_GAIN: ${{ vars.ASMR_NARRATION_GAIN || '0.35' }}
      ASMR_SOURCE_SEC: ${{ vars.ASMR_SOURCE_SEC || '1200' }}
      # 재생목록: 채널의 ASMR 재생목록 정확한 이름(오타 방지용으로 여기서 고정 권장)
      ASMR_PLAYLIST: ${{ vars.ASMR_PLAYLIST }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pipeline/requirements.txt

      # 1) 시스템 의존성: ffmpeg + 한국어 폰트(썸네일 문구)
      - name: 시스템 의존성 설치
        run: |
          set -e
          # 이미 있는 건 설치하지 않는다 — apt-get update 가 미러 상태에 따라
          # 수 분씩 걸리는 사고가 있었다(2026-08-06 asmr: 이 스텝에만 9분 28초).
          NEED=""
          command -v ffmpeg >/dev/null 2>&1 || NEED="$NEED ffmpeg"
          fc-list 2>/dev/null | grep -qi nanum || NEED="$NEED fonts-nanum"
          if [ -n "$NEED" ]; then
            echo "apt 설치 대상:$NEED"
            sudo apt-get update
            sudo apt-get install -y $NEED
          else
            echo "시스템 의존성 이미 충족 — apt 스킵"
          fi
          python -m pip install -r pipeline/requirements.txt

      # 1b) dedupe ledger 복원/저장(런 간 영속 — 레포에 쓰지 않음)
      - name: ledger 캐시 복원/저장
        uses: actions/cache@v4
        with:
          path: output/asmr_ledger.json
          key: asmr-ledger-${{ github.run_id }}
          restore-keys: asmr-ledger-

      # 2) YouTube 자격증명(소설과 동일 채널 → 확장 스코프 token_novel 재사용)
      - name: YouTube 자격증명(ASMR=소설 채널)
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON_NOVEL: ${{ secrets.YT_TOKEN_JSON_NOVEL }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          mkdir -p pipeline/secrets
          if [ -n "$YT_CLIENT_SECRET_JSON" ]; then
            printf '%s' "$YT_CLIENT_SECRET_JSON" > pipeline/secrets/client_secret.json
          fi
          if [ -n "$YT_TOKEN_JSON_NOVEL" ]; then
            printf '%s' "$YT_TOKEN_JSON_NOVEL" > pipeline/secrets/token_novel.json
            echo "확장 스코프 토큰 사용(재생목록 가능)"
          elif [ -n "$YT_TOKEN_JSON" ]; then
            printf '%s' "$YT_TOKEN_JSON" > pipeline/secrets/token_novel.json
            echo "쇼츠 토큰 폴백(재생목록은 스코프 부족 시 자동 스킵)"
          else
            echo "⚠️ 업로드 토큰 없음 — 렌더만 진행"
          fi

      # 3) 처리 대상 결정 (dispatch 입력 / push diff / 전체)
      - name: 처리 대상 결정
        id: pick
        run: |
          set -e
          SP="${{ github.event.inputs.spec }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$SP" ]; then
            FILES="$SP"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"; AFTER="${{ github.event.after }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1 HEAD"
            else
              RANGE="$BEFORE $AFTER"
            fi
            FILES=$(git diff --name-only --diff-filter=AM $RANGE -- output/asmr/ 2>/dev/null \
                    | grep -E '_asmr.*\.json$|/[0-9].*\.json$' | tr '\n' ' ' || true)
          else
            FILES=$(find output/asmr -type f -name '*.json' 2>/dev/null | grep -v state.json | tr '\n' ' ' || true)
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "선정된 파일: '$FILES'"

      # 4) 렌더 + 업로드
      - name: 렌더 + 업로드
        run: |
          FILES="${{ steps.pick.outputs.files }}"
          if [ -z "$(echo $FILES | tr -d ' ')" ]; then
            echo "처리할 신규 ASMR 스펙 없음 — 종료."
            exit 0
          fi
          cd pipeline
          python run_asmr.py $(for f in $FILES; do echo "../$f"; done) \
            --use-ledger --ledger-path ../output/asmr_ledger.json --log ../output/asmr_log.json \
            $([ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_private }}" = "true" ] && echo --force-private) \
            $([ "${{ github.event.inputs.no_upload }}" = "true" ] && echo --no-upload)

      # 산출물(mp4)은 유튜브로만. 아티팩트/레포 커밋 안 함. ledger 는 actions/cache 로 보존.
