<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pretendard";
        font-weight: 400;
        src: url("assets/fonts/Pretendard-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-weight: 700;
        src: url("assets/fonts/Pretendard-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Pretendard";
        font-weight: 800;
        src: url("assets/fonts/Pretendard-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0A0808; /* brand ink */
      }
      body { font-family: "Pretendard", system-ui, sans-serif; }

      /* ---- stage: 켄번즈가 걸리는 전체 무대 ---- */
      #stage {
        position: absolute;
        inset: 0;
        /* 다크 배경 밴딩 방지 → radial + 로컬 글로우 */
        background:
          radial-gradient(120% 80% at 50% 18%, #1c1410 0%, #0A0808 60%),
          #0A0808;
        transform-origin: 50% 42%;
      }
      /* 코랄 엠버 글로우(로컬) */
      .ember {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.55;
        background: radial-gradient(circle, #D97757 0%, rgba(217,119,87,0) 70%);
      }
      #ember-a { width: 700px; height: 700px; left: -120px; top: 380px; }
      #ember-b { width: 620px; height: 620px; right: -160px; top: 980px; opacity: 0.4; }

      /* ---- 스튜디오 데스크 ---- */
      #desk {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 560px;
        background: linear-gradient(180deg, #14100d 0%, #0A0808 100%);
        border-top: 6px solid rgba(217,119,87,0.55);
        box-shadow: 0 -30px 80px rgba(217,119,87,0.18);
      }

      /* ---- 앵커 두 명(투샷 placeholder) ---- */
      .anchor {
        position: absolute;
        bottom: 470px;
        width: 440px;
        height: 720px;
        border-radius: 220px 220px 48px 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 70px;
      }
      #byeoi  { left: 70px;  background: linear-gradient(180deg, #2a3b46 0%, #16222a 100%); }
      #byeolha{ right: 70px; background: linear-gradient(180deg, #4a2f28 0%, #2a1a15 100%); }
      .face { font-size: 200px; line-height: 1; filter: drop-shadow(0 8px 24px rgba(0,0,0,0.5)); }
      .name {
        margin-top: 28px;
        font-size: 56px;
        font-weight: 800;
        letter-spacing: 2px;
        padding: 10px 30px;
        border-radius: 16px;
        color: #EDD9BC; /* cream */
      }
      #byeoi  .name { background: rgba(91,200,255,0.16);  }
      #byeolha .name { background: rgba(255,210,63,0.16); }

      /* 화자 강조 글로우(별하 강조 샷) */
      #spotlight {
        position: absolute;
        right: 30px; bottom: 430px;
        width: 520px; height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217,119,87,0.45) 0%, rgba(217,119,87,0) 65%);
        filter: blur(20px);
      }

      /* 상단 토픽 배지 */
      #badge {
        position: absolute;
        top: 150px; left: 50%;
        transform: translateX(-50%);
        background: #D97757;
        color: #0A0808;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: 1px;
        padding: 18px 44px;
        border-radius: 999px;
      }

      /* 비네트 */
      #vignette {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
      }
      /* 필름 그레인(가벼운 SVG noise) */
      #grain {
        position: absolute; inset: -50%;
        width: 200%; height: 200%;
        opacity: 0.06; pointer-events: none;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
    >
      <div id="stage" class="clip" data-start="0" data-duration="5" data-track-index="0">
        <div id="ember-a" class="ember"></div>
        <div id="ember-b" class="ember"></div>
        <div id="spotlight"></div>
        <div id="byeoi" class="anchor"><div class="face">🧑‍💼</div><div class="name">별이</div></div>
        <div id="byeolha" class="anchor"><div class="face">👩‍💼</div><div class="name">별하</div></div>
        <div id="desk"></div>
        <div id="badge">일상공감뉴스</div>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <div id="grain" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // 켄번즈: 무대 전체 천천히 줌인
      tl.fromTo("#stage", { scale: 1.0 }, { scale: 1.08, duration: 5, ease: "none" }, 0);

      // 패럴랙스: 두 앵커가 살짝 반대로 (대화 리듬)
      tl.fromTo("#byeoi",  { x: -30 }, { x: -8,  duration: 5, ease: "sine.inOut" }, 0);
      tl.fromTo("#byeolha",{ x: 30 },  { x: 10,  duration: 5, ease: "sine.inOut" }, 0);

      // 진입 애니메이션 (각 요소 IN)
      tl.from("#badge",   { y: -60, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.15);
      tl.from("#byeoi",   { y: 80, opacity: 0, duration: 0.7, ease: "power2.out" }, 0.25);
      tl.from("#byeolha", { y: 80, opacity: 0, duration: 0.7, ease: "back.out(1.4)" }, 0.35);

      // 화자 강조 팝: 별하(이 샷 화자) 스케일 + 스포트라이트 펄스
      tl.fromTo("#byeolha", { scale: 1.0 }, { scale: 1.05, duration: 0.5, ease: "power2.out" }, 0.6);
      tl.fromTo("#spotlight", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.5);
      // 스포트라이트 미세 펄스(유한 반복)
      const cycle = 1.5;
      tl.to("#spotlight", { opacity: 0.7, duration: cycle/2, ease: "sine.inOut",
                            yoyo: true, repeat: Math.ceil((5 - 1.3) / cycle) - 1 }, 1.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
